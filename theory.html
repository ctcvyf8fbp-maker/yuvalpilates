<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לומדים פילאטיס – עיוני</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#1F2A2E; --muted:#5E6E70; --line:#D6E0DE;
  --teal:#2F6F6A; --teal-soft:#DCEAE7; --on-teal:#FFFFFF;
  --spring:#E8B04B; --spring-ink:#3A2A05;
  --good:#2E7D4F; --good-soft:#DDF1E3; --bad:#B3473C; --bad-soft:#F7E1DE;
  --stage:#1E3532; --stage-ink:#F2F6F4; --stage-muted:#A9C2BD;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121A1B; --surface:#1B2527; --ink:#E7EFEE; --muted:#9AB0AE; --line:#2C3A3C;
    --teal:#5FB0A8; --teal-soft:#1F3634; --on-teal:#0E1A19;
    --spring:#F0BE5E; --spring-ink:#2A1E03;
    --good:#6CCB8F; --good-soft:#18301F; --bad:#E8857A; --bad-soft:#3A1F1C;
    --stage:#0D1A18; --stage-ink:#EEF5F3; --stage-muted:#8FAAA5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A1B; --surface:#1B2527; --ink:#E7EFEE; --muted:#9AB0AE; --line:#2C3A3C;
  --teal:#5FB0A8; --teal-soft:#1F3634; --on-teal:#0E1A19;
  --spring:#F0BE5E; --spring-ink:#2A1E03;
  --good:#6CCB8F; --good-soft:#18301F; --bad:#E8857A; --bad-soft:#3A1F1C;
  --stage:#0D1A18; --stage-ink:#EEF5F3; --stage-muted:#8FAAA5;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--spring);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 40px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:"Secular One","Assistant",sans-serif;font-weight:400;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.2px}
.total{font-size:14px;color:var(--muted);white-space:nowrap}
.coil{height:8px;margin:10px 0 12px;border-radius:8px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 9px);position:relative;overflow:hidden}
.coil i{position:absolute;inset:0 0 0 auto;background:repeating-linear-gradient(90deg,var(--spring) 0 6px,transparent 6px 9px);transition:width .5s ease}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:15px;position:relative}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--spring);margin-inline-start:6px;vertical-align:middle}
.chtitle{margin:10px 0 4px;font-size:20px;font-weight:700}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px;margin:10px 0 18px}
.tab{border:0;background:transparent;border-radius:10px;padding:9px 4px;font-weight:700;font-size:15px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--teal-soft);color:var(--ink)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toggle{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.toggle[aria-pressed="true"]{border-color:var(--teal);color:var(--teal)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px}

.flip{perspective:1200px;cursor:pointer;user-select:none}
.inner{display:grid;transition:transform .5s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:26px 22px;min-height:250px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.front{background:var(--surface);border:1.5px solid var(--line)}
.back{background:var(--teal);color:var(--on-teal);transform:rotateY(180deg)}
.face .k{font-size:13px;font-weight:700;opacity:.7}
.face p{margin:0;font-size:22px;line-height:1.45;font-weight:700}
.back p{font-weight:600;font-size:19px}
.face small{color:var(--muted);font-size:13px}

.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border-radius:14px;padding:13px 10px;font-weight:700;font-size:16px;border:1.5px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--spring);border-color:var(--spring);color:var(--spring-ink)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.navrow{display:flex;justify-content:space-between;margin-top:10px}
.link{border:0;background:none;color:var(--muted);font-weight:600;padding:6px 2px}

.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:22px}
.panel h2{margin:0 0 8px;font-size:22px}
.q{font-size:20px;font-weight:700;margin:4px 0 16px;line-height:1.4}
.opts{display:grid;gap:10px}
.opt{text-align:start;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;font-size:17px;font-weight:600}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-weight:700}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.big{font-family:"Secular One",sans-serif;font-size:56px;line-height:1;margin:6px 0}
.review{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.review li{border-inline-start:4px solid var(--bad);padding:4px 10px;background:var(--bg);border-radius:6px}
.review b{display:block}

.stage{position:relative;overflow:hidden;background:var(--stage);color:var(--stage-ink);border-radius:22px;aspect-ratio:4/5;max-height:72vh;padding:26px 22px;display:flex;flex-direction:column}
.stage .ring{position:absolute;width:280px;height:280px;border-radius:50%;border:2px solid var(--spring);opacity:.18;left:-90px;bottom:-90px;animation:breathe 6s ease-in-out infinite}
.stage .ring.b{width:180px;height:180px;left:-40px;bottom:-40px;animation-delay:-3s}
@keyframes breathe{0%,100%{transform:scale(.9)}50%{transform:scale(1.12)}}
.slabel{font-size:14px;color:var(--stage-muted);font-weight:600}
.stitle{font-family:"Secular One",sans-serif;font-size:32px;line-height:1.15;margin:10px 0 18px;transition:opacity .4s}
.sbul{list-style:none;margin:0;padding:0;display:grid;gap:14px;position:relative}
.sbul li{font-size:20px;font-weight:600;line-height:1.4;padding-inline-start:18px;position:relative;opacity:0;transform:translateY(8px);transition:opacity .45s,transform .45s}
.sbul li::before{content:"";position:absolute;inset-inline-start:0;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--spring)}
.sbul li.in{opacity:1;transform:none}
.sbul li.now{color:var(--spring)}
.bar{height:5px;background:rgba(255,255,255,.15);border-radius:5px;margin-top:auto;overflow:hidden}
.bar i{display:block;height:100%;background:var(--spring);width:0;transition:width .4s}
.ctrls{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px}
.cbtn{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:20px;display:grid;place-items:center}
.cbtn.play{width:66px;height:66px;background:var(--spring);border-color:var(--spring);color:var(--spring-ink);font-size:24px}
.cbtn.small{width:auto;padding:0 14px;height:40px;border-radius:999px;font-size:14px;font-weight:700}
.hint{font-size:14px;color:var(--muted);text-align:center;margin-top:12px}
.empty{text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sitenav{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:10px 0 12px;border-radius:12px;background:var(--line)}
.sitenav a{display:block;text-align:center;padding:8px 6px;border-radius:9px;font-weight:700;text-decoration:none;color:var(--muted)}
.sitenav a[aria-current="page"]{background:var(--surface);color:var(--ink)}
</style>
</head>

<div class="wrap">

  <main id="view"></main>
</div>

<script>
const CH=[
{n:1,t:"היסטוריה ועקרונות השיטה",
cards:[
["מתי ואיפה נולד ג׳וזף פילאטיס?","ב־1880 בדיסלדורף, גרמניה."],
["מאילו מחלות סבל פילאטיס בילדותו?","רככת, אסתמה ודלקת פרקים. הרצון להתגבר עליהן הוביל אותו לפיתוח הגוף – התעמלות, צלילה ופילוסופיות מזרחיות ומערביות."],
["מה קרה לפילאטיס במלחמת העולם הראשונה?","הוא היה באנגליה (מאז 1912) והועבר למחנה באי מאן. שם לימד את חבריו ותכנן מכשירים לשיקום נכים וחולים."],
["מתי ואיפה נפתח הסטודיו הראשון?","ב־1926 – ג׳וזף וקלרה פתחו בניו יורק את מכון ״קונטרולוג׳י״."],
["איך קרא פילאטיס לשיטה שלו?","קונטרולוג׳י (Contrology) – דרך חיים, ולא רק סדרת תרגילים."],
["כמה תרגילים פיתח פילאטיס על המכשירים?","יותר מ־600 תרגילים."],
["מה הקו המנחה בבניית המכשירים?","״השלם״ – הגוף השלם צריך לעבוד כדי לטפח בריאות טובה."],
["איזה כיווץ יוצרים הקפיצים במכשירים?","אקסצנטרי וקונצנטרי בשרירים המניעים, ובמקביל המייצבים עובדים בכיווץ איזומטרי."],
["מהם 10 עקרונות הפילאטיס?","מודעות, איזון, שליטה, יעילות, דיוק, נשימה, ריכוז, מרכז, זרימה, הרמוניה."],
["מה המשפט שמייחד את השיטה?","״זה לא מה שאנחנו עושים אלא איך אנחנו עושים״."],
["מה כולל הידע המדעי של מדריך?","אנטומיה, פיזיולוגיה והבנה מכנית של גוף האדם."],
["אילו כללי בטיחות חשובים בשיעור?","חימום מקדים, מעקב אחרי דופק וחום גוף, הרפיה בסוף, שימוש נכון בקפיצים ורצועות – וגם המדריך עומד בנקודה בטוחה."]],
quiz:[
["באיזו שנה נפתח הסטודיו הראשון בניו יורק?",["1912","1926","1880","1945"],1],
["איזה מהבאים אינו אחד מ־10 העקרונות?",["זרימה","דיוק","גמישות","מרכז"],2],
["היכן פיתח פילאטיס מכשירים לשיקום פצועים?",["בדיסלדורף","בניו יורק","במחנה באי מאן","בלונדון"],2],
["מה עושים השרירים המייצבים בזמן עבודה עם קפיצים?",["כיווץ קונצנטרי","כיווץ אקסצנטרי","כיווץ איזומטרי","מרפים לגמרי"],2]],
les:[
["מי היה ג׳וזף פילאטיס?",["נולד ב־1880 בדיסלדורף","ילד חולני: רככת, אסתמה, דלקת פרקים","פיתח את גופו כדי להתגבר"]],
["מהמחנה לניו יורק",["1912 – עובר לאנגליה","במלחמה – מחנה באי מאן ומכשירים לשיקום","1926 – סטודיו קונטרולוג׳י עם קלרה"]],
["השיטה",["יותר מ־600 תרגילים על המכשירים","הקפיצים: כיווץ אקסצנטרי וקונצנטרי","המייצבים עובדים איזומטרית"]],
["עשרת העקרונות",["מודעות, איזון, שליטה, יעילות, דיוק","נשימה, ריכוז, מרכז, זרימה, הרמוניה","לא מה עושים – אלא איך"]]]},

{n:2,t:"מרכז הכובד, מנחים ונשימה",
cards:[
["איפה נמצא מרכז הכובד?","באזור האגן. המיקום המדויק שונה מעט מאדם לאדם – בגלל מבנה הגוף, לא בהכרח רמת הכוח."],
["מהו אגן ניטרלי?","שני ה־ASIS וה־PS באותו מישור – אופקי בשכיבה, אנכי בעמידה."],
["בשכיבה ה־PS גבוה מה־ASIS. איזה מנח?","Posterior Pelvic Tilt (PPT) – הטיה אחורה."],
["בשכיבה ה־ASIS גבוה מה־PS. איזה מנח?","Anterior Pelvic Tilt (APT) – הטיה קדימה."],
["מהו עמוד שדרה ניטרלי?","לורדוזה צווארית, קיפוזה בחוליות בית החזה ולורדוזה מותנית."],
["נקודות המגע בשכיבה בעמוד שדרה ניטרלי","גב הגולגולת, השכמות ותחילת כלוב הצלעות (עד T8), עצם הזנב."],
["קו האנך בעמידה – אילו נקודות?","תנוך האוזן, מרכז קשת הצוואר, מפרק הכתף, מרכז הקשת המותנית, תל הירך הגדול, קצת לפני אמצע הברך, הקרסול החיצוני."],
["מה זה Imprinting (הטבעה)?","שקיעה של החוליות במזרן כמו טביעת אצבע, לתמיכה במעבר לכפיפה. אפשרית גם בלי לשנות את מנח האגן."],
["דוגמאות לתרגילים עם הטבעה","Pelvic Curl (חוליה אחר חוליה) ו־Chest Lift (הגנה על החוליות בזמן מאמץ בטן)."],
["אילו שרירים מחזקים לתיקון APT?","שרירי הבטן ופושטי הירך."],
["אילו שרירים מחזקים לתיקון PPT?","פושטי עמוד השדרה וכופפי הירך."],
["כמה מפרקים ושרירים משתתפים בנשימה?","88 מפרקים ו־46 שרירים."],
["מה עושה הסרעפת בשאיפה?","מתכווצת ויורדת, מגדילה את חלל בית החזה – הלחץ יורד והאוויר נכנס."],
["מה עושה הסרעפת בנשיפה?","משתחררת ועולה, נפח בית החזה קטן, הלחץ עולה – האוויר יוצא."],
["איזה חלק מהמאמץ הנשימתי עושה הסרעפת?","כ־75%."],
["מהי נשימת פילאטיס?","נשימה לטרלית (רוחבית, בין־צלעית) – מאפשרת לשמור את שרירי הבטן אסופים, במיוחד בנשיפה."],
["מהן ״נשימות כלב״?","נשימה מהירה, בטנית: 5 שאיפות ו־5 נשיפות. למשל ב־Hundred וב־Swimming."],
["ציר קורונלי – איזה מישור ואילו תנועות?","מישור סגיטלי: כפיפה ופשיטה."],
["ציר סגיטלי – איזה מישור ואילו תנועות?","מישור קורונלי (פרונטלי): הרחקה וקירוב."],
["ציר אורך – איזה מישור ואילו תנועות?","מישור טרנסברסלי (אופקי): סיבובים."]],
quiz:[
["בשכיבה ה־ASIS גבוה מה־PS. מה המנח?",["אגן ניטרלי","PPT","APT","הטבעה"],2],
["מה מחזקים לתיקון APT?",["פושטי גב וכופפי ירך","בטן ופושטי ירך","מקרבי ירך","שרירי חזה"],1],
["איזו נשימה מאפיינת את שיטת הפילאטיס?",["בטנית","לטרלית","נשימת כלב","עצירת נשימה"],1],
["הרחקת הרגל מתרחשת במישור…",["סגיטלי","קורונלי","טרנסברסלי","אלכסוני"],1],
["איזה חלק מהמאמץ הנשימתי עושה הסרעפת?",["25%","50%","75%","100%"],2]],
les:[
["אגן ניטרלי",["ASIS ו־PS באותו מישור","PS גבוה – PPT","ASIS גבוה – APT"]],
["עמוד שדרה ניטרלי",["לורדוזה צווארית","קיפוזה בבית החזה","לורדוזה מותנית"]],

["היפרטרופיה ואטרופיה","היפרטרופיה – גדילה בהיקף השריר. אטרופיה – דלדול, ירידה בהיקף."],

["מרכיבי כושר הקשורים למיומנות","שיווי משקל, זריזות, זמן תגובה, מהירות וקואורדינציה."],
["רקדנים מול ספורטאים","לרקדנים לרוב חסר חוזק (היפר־מוביליות), לספורטאים חסרה גמישות."],
["5 זוגות שרירים עם חוסר איזון נפוץ","פושטי גב–בטן; כופפי ירך–Hamstrings; Rhomboids–Pectorals; כופפי קרסול פלנטריים–דורסליים; מהפכי כף רגל החוצה–פנימה."],

["מהי שיטת הבלוק?","חלוקת הרפרטואר לבלוקים לפי נושאים, כך שכל שיעור כולל לפחות תרגיל אחד מכל בלוק."],
["מה סדר הבלוקים?","Warm Up, Foot Work, Abdominal Work, Hip Work, Spinal Articulation, Arm Work, Leg Work, Full Body Integration, Side Flexion and Rotation, Back Extension, Stretches."],
["משתמשים בכל הבלוקים כבר מהשיעור הראשון?","לא בהכרח. עם ההתקדמות מבנה השיעור מתרחב ויש בו יותר בלוקים."],
["למה מבצעים Roll Down בפתיחה ובסיום?","כלי אבחוני למצב החוליות, היציבה והשרירים; מאפשר להתרכז; ומשמש כחימום וצינון."],
["פיצוי מול הסתגלות","הסתגלות (Adaptation) – התאמה נורמלית של הגוף לתנועה. פיצוי (Compensation) – תנועה לא רצויה שפוגעת במנח."],
["דוגמה לפיצוי ב־Side Kick","APT עם היפרלורדוזיס כשהרגל נעה אחורה, וכיפוף הגב כשהרגל נעה קדימה."],
["מה זה Modification?","שינוי קל בתנועה או במנח כדי להקל או לאתגר, תוך שמירה על מטרת התרגיל."],
["דוגמה למודיפיקציה – שכיבה עם רגליים ב־90°","קירוב הברכיים לגוף – הקלה. יישור הרגליים לתקרה – אתגר."],
["מה זה Assist?","הוספת אביזר (כדור, משולש, מג׳יק) לתמיכה או לאתגר, תוך שמירה על מטרת התרגיל."],

{n:5,t:"מערכת היציבה וחיזוק הליבה",
cards:[
["נקודות הציון במבט מהצד בעמידה","תנוך האוזן, מפרק הכתף, תל הירך הגדול, קצת לפני אמצע הברך, הקרסול החיצוני."],
["מה בודקים במבט מלפנים ומאחור?","סימטריה: הטיית הראש, גובה הכתפיים, מרחק הידיים מהגוף, גובה ה־ASIS, כיוון הברכיים ומנח כפות הרגליים."],
["נקודות המגע בשכיבה על הגב","אמצע הגולגולת, השכמות, כלוב הצלעות (בלי הצלעות המרחפות), עצם הזנב."],
["סטייה מבנית מול נרכשת","מבנית – מולדת; נרכשת – מתפתחת. לרוב שילוב, ומערכת השרירים מתאימה את עצמה לסטייה."],
["Sway Back – יציבה עייפה","אגן מוזז קדימה ועמוד השדרה הגבי אחורה (PPT). תיקון: חיזוק פושטי הגב העליון וכופפי הירך (Iliopsoas)."],
["Forward Head – ראש נוטה קדימה","קשת צוואר מוגברת, לרוב עם כתפיים פנימה וגבנון. תיקון: חיזוק גב עליון, מתיחת שרירי החזה ותנועתיות צוואר."],
["Lumbar Hyperlordosis","קעור יתר בגב התחתון, לרוב עם APT. תיקון: חיזוק בטן, מתיחת כופפי ירך ופושטי גב."],
["Kyphosis – גבנון","קימור יתר בחוליות בית החזה. תיקון: חיזוק פושטי הגב והגב העליון, מתיחת שרירי החזה."],
["סקוליוזיס","עיקום במישור הקורונלי עם רוטציה של החוליות. בפילאטיס עובדים בתנועות סימטריות; בחשד – הפניה להערכה רפואית."],
["אילו שני שרירים הוכחו כמונעים כאבי גב?","Transverse Abdominis (הרחב הבטני) ו־Multifidus."],
["Roll Down – מוצא ונשימות","גב לקיר, רגליים ברוחב אגן. נשיפה – גלגול מטה מהצוואר; שאיפה – העמקה; נשיפה – גלגול חזרה חוליה אחר חוליה."],
["כמה מהאוכלוסייה סובלים מכאבי גב?","כ־80%, בשלב זה או אחר של החיים."],
["השריר החשוב ביותר בבטן לתמיכה בגב","Transversus Abdominis (TA)."],
["פושט הגב החשוב ביותר ליציבה","Multifidus."],
["מה עושה ה־Rectus Abdominis?","מייצר כפיפה של עמוד השדרה. ה־TA והאלכסונים חשובים יותר לתמיכה."],
["בלט דיסק מול פריצת דיסק","בלט – הדיסק בולט אבל השכבות החיצוניות שלמות. פריצה – חלק מהגרעין (Nucleus Pulposus) נדחף החוצה דרך קרע."],
["Spinal Stenosis","היצרות תעלת עמוד השדרה שלוחצת על חוט השדרה או העצבים. נפוצה בעיקר מגיל 60."],
["Spondylolysis","פגם בקשת החוליה, לרוב ב־L5. כ־3–6% מהאוכלוסייה."],
["Spondylolisthesis","גלישה קדימה של חוליה ביחס לחוליה שמתחתיה."],
["כמה פעמים בשבוע מומלץ לתרגל לגב?","2–3 פעמים בשבוע – הרבה יותר טוב מפעם אחת."],
["מודיפיקציה לשכיבה עם רגליים ב־90°","משולש מתחת לאגן – מקל על הבטן ומוריד עומס מהגב."],
["מה אסור לשים בתרגילי כפיפה?","משולש מתחת לאגן. אפשר כרית שטוחה או חצי עגולה מתחת ל־Sacrum."],
["אסיסט ל־Roll Up ו־Neck Pull","כרית חצי עגולה מתחת לחוליות L – מפצה על חוסר תנועתיות ומאפשרת גיוס בטן נכון."]],

{n:6,t:"פתולוגיות נפוצות ושיקום",
cards:[
["דלקת פרקים ניוונית מול שגרונית","ניוונית (Osteoarthritis) – מפרקים גדולים, שחיקת סחוס, גיל, טראומה ועודף משקל. שגרונית (Rheumatoid) – מפרקים קטנים, כמו פרקי האצבעות."],
["הטיפול היעיל ביותר בשחיקת סחוס","ירידה במשקל ופעילות גופנית סדירה. במקרים קשים – ניתוח להחלפת מפרק."],
["JHS – תסמונת גמישות יתר","טווח תנועה גדול מהנורמלי; 10–15% מהאוכלוסייה. סיכון לפריקות, קרעי גידים ורצועות."],
["Strain מול Sprain","Strain – מתיחת יתר של שריר (הנקודה החלשה: חיבור שריר וגיד). Sprain – נקע, פגיעה ברצועה."],
["דרגות של נקע","שלוש דרגות: ראשונה – קרע מינורי; שלישית – קרע מלא של הרצועה. MRI מדויק יותר."],
["הנקעים המוכרים בקרסול ובברך","קרסול – הרצועה הקדמית בין השוקית לעצם הטלוס. ברך – הרצועה הצולבת הקדמית (ACL)."],
["Tendonitis – דלקת גיד","דלקת בגיד בעקבות שינויים ניווניים או מיקרו טראומות. הגיד מאבד גמישות ונעשה נוקשה."],
["Bursitis","דלקת בבורסה – שק נוזל שמקטין חיכוך (יש כ־160 בגוף). בעברית: אמתחת או כסת."],
["מה מומלץ באוסטאופורוזיס?","תרגול עם נשיאת משקל: דחיפת הבר ב־Foot Work, עמידת שש, סקוואטים. השברים בעיקר בעמוד השדרה, באגן ובפרק כף היד."],

const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

let state={ch:store.get("pil-ch","all"),tab:store.get("pil-tab","cards")};
let known=store.get("pil-known",{});
const sel=()=>state.ch==="all"?CH:CH.filter(c=>c.n===state.ch);

function updateTotals(){
  let tot=0,k=0;CH.forEach(c=>c.cards.forEach((_,i)=>{tot++;if(known[c.n+"-"+i])k++}));
  $("#total").textContent=k+" מתוך "+tot+" כרטיסיות";
  $("#coilFill").style.width=(tot?100-k/tot*100:100)+"%";
}
function chDone(c){return c.cards.every((_,i)=>known[c.n+"-"+i])}
function renderChips(){
  const el=$("#chips");
  el.innerHTML=`<button class="chip" data-ch="all" aria-pressed="${state.ch==="all"}">הכול</button>`+
    CH.map(c=>`<button class="chip" data-ch="${c.n}" aria-pressed="${state.ch===c.n}">פרק ${c.n}${chDone(c)?'<span class="dot" title="הושלם"></span>':""}</button>`).join("");
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    state.ch=b.dataset.ch==="all"?"all":+b.dataset.ch;store.set("pil-ch",state.ch);
    renderChips();rebuild();
  });
  const cur=el.querySelector('[aria-pressed="true"]');if(cur)cur.scrollIntoView({inline:"center",block:"nearest"});
  $("#chtitle").textContent=state.ch==="all"?"כל הפרקים":sel()[0].t;
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;store.set("pil-tab",state.tab);rebuild()});

function rebuild(){
  stopVideo();
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===state.tab));
  if(state.tab==="cards"){buildDeck();renderCards()}
  else if(state.tab==="quiz"){buildQuiz();renderQuiz()}
  else{buildVideo();renderVideo()}
}

let fc={list:[],i:0,flipped:false,only:false,mix:false,done:false};
function buildDeck(){
  let l=[];sel().forEach(c=>c.cards.forEach((cd,i)=>l.push({id:c.n+"-"+i,f:cd[0],b:cd[1],n:c.n})));
  if(fc.only)l=l.filter(x=>!known[x.id]);
  if(fc.mix)l=shuffle(l);
  fc.list=l;fc.i=0;fc.flipped=false;fc.done=false;
}
function renderCards(){
  const v=$("#view");
  const tools=`<div class="toolbar">
    <button class="toggle" id="tOnly" aria-pressed="${fc.only}">רק מה שעוד לא ידעתי</button>
    <button class="toggle" id="tMix" aria-pressed="${fc.mix}">ערבוב</button></div>`;
  if(!fc.list.length){
    v.innerHTML=tools+`<div class="panel empty"><h2>אין כרטיסיות לחזרה כאן</h2><p>סימנת את כולן כ״ידעתי״. אפשר לעבור לבוחן או להציג שוב את כל הכרטיסיות.</p><div class="row"><button class="btn teal" id="showAll">הצגת כל הכרטיסיות</button></div></div>`;
    bindTools();$("#showAll").onclick=()=>{fc.only=false;buildDeck();renderCards()};return;
  }
  if(fc.done){
    const k=fc.list.filter(x=>known[x.id]).length,left=fc.list.length-k;
    v.innerHTML=tools+`<div class="panel"><h2>סיימת סבב</h2><div class="big">${k}/${fc.list.length}</div><p>${left?`נשארו ${left} כרטיסיות לחזרה.`:"ידעת את כולן!"}</p>
      <div class="row">${left?'<button class="btn primary" id="again">חזרה על מה שלא ידעתי</button>':""}<button class="btn" id="restart">מההתחלה</button></div></div>`;
    bindTools();
    if(left)$("#again").onclick=()=>{fc.only=true;buildDeck();renderCards()};
    $("#restart").onclick=()=>{buildDeck();renderCards()};return;
  }
  const c=fc.list[fc.i];
  v.innerHTML=tools+`
  <div class="meta"><span>${fc.i+1} / ${fc.list.length}</span><span>פרק ${c.n}${known[c.id]?" · ידעתי":""}</span></div>
  <div class="flip ${fc.flipped?"on":""}" id="flip" role="button" tabindex="0" aria-label="הפיכת הכרטיסייה">
    <div class="inner">
      <div class="face front"><span class="k">שאלה</span><p>${esc(c.f)}</p><small>הקישו כדי לראות תשובה</small></div>
      <div class="face back"><span class="k">תשובה</span><p>${esc(c.b)}</p></div>
    </div>
  </div>
  <div class="row"><button class="btn" id="no">לחזור על זה</button><button class="btn primary" id="yes">ידעתי</button></div>
  <div class="navrow"><button class="link" id="prev" ${fc.i?"":"disabled"}>→ הקודמת</button><button class="link" id="next">הבאה ←</button></div>`;
  bindTools();
  const flip=$("#flip");
  const toggle=()=>{fc.flipped=!fc.flipped;flip.classList.toggle("on",fc.flipped)};
  flip.onclick=toggle;flip.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle()}};
  let sx=null;flip.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
  flip.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>60){dx>0?go(1):go(-1)}});
  $("#yes").onclick=()=>{known[c.id]=1;save();go(1)};
  $("#no").onclick=()=>{delete known[c.id];save();go(1)};
  $("#prev").onclick=()=>go(-1);$("#next").onclick=()=>go(1);
}
function go(d){fc.flipped=false;fc.i+=d;if(fc.i<0)fc.i=0;if(fc.i>=fc.list.length)fc.done=true;renderCards()}
function save(){store.set("pil-known",known);updateTotals();renderChipsQuiet()}
function renderChipsQuiet(){CH.forEach(c=>{const b=document.querySelector(`.chip[data-ch="${c.n}"]`);if(!b)return;const has=!!b.querySelector(".dot");if(chDone(c)!==has){b.innerHTML="פרק "+c.n+(chDone(c)?'<span class="dot" title="הושלם"></span>':"")}})}
function bindTools(){
  $("#tOnly").onclick=()=>{fc.only=!fc.only;buildDeck();renderCards()};
  $("#tMix").onclick=()=>{fc.mix=!fc.mix;buildDeck();renderCards()};
}

/* ---------- Quiz ---------- */
let qz={};
function buildQuiz(){
  let l=[];sel().forEach(c=>c.quiz.forEach(q=>l.push({n:c.n,q:q[0],o:q[1],a:q[2]})));
  l=shuffle(l);if(state.ch==="all")l=l.slice(0,15);
  l=l.map(x=>{const idx=shuffle(x.o.map((_,i)=>i));return{...x,o:idx.map(i=>x.o[i]),a:idx.indexOf(x.a)}});
  qz={list:l,i:0,score:0,picked:null,wrong:[]};
}
function renderQuiz(){
  const v=$("#view");
  if(qz.i>=qz.list.length){
    const pct=Math.round(qz.score/qz.list.length*100);
    v.innerHTML=`<div class="panel"><h2>${pct>=85?"מצוין!":pct>=60?"יפה מאוד, עוד קצת חזרה":"שווה לעבור שוב על הכרטיסיות"}</h2>
      <div class="big">${qz.score}/${qz.list.length}</div>
      ${qz.wrong.length?`<p>מה כדאי לחזור עליו:</p><ul class="review">${qz.wrong.map(w=>`<li>${esc(w.q)}<b>${esc(w.o[w.a])}</b></li>`).join("")}</ul>`:""}
      <div class="row"><button class="btn primary" id="retry">בוחן חדש</button></div></div>`;
    $("#retry").onclick=()=>{buildQuiz();renderQuiz()};return;
  }
  const q=qz.list[qz.i],p=qz.picked;
  v.innerHTML=`<div class="meta"><span>שאלה ${qz.i+1} מתוך ${qz.list.length}</span><span>פרק ${q.n} · ${qz.score} נכונות</span></div>
  <div class="panel"><div class="q">${esc(q.q)}</div>
  <div class="opts">${q.o.map((o,i)=>`<button class="opt ${p!==null&&i===q.a?"right":""} ${p===i&&i!==q.a?"wrong":""}" data-i="${i}" ${p!==null?"disabled":""}>${esc(o)}</button>`).join("")}</div>
  ${p!==null?`<div class="fb ${p===q.a?"ok":"no"}">${p===q.a?"נכון!":"התשובה הנכונה: "+esc(q.o[q.a])}</div><div class="row"><button class="btn teal" id="qnext">${qz.i+1<qz.list.length?"לשאלה הבאה":"לתוצאות"}</button></div>`:""}
  </div>`;
  v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(qz.picked!==null)return;qz.picked=+b.dataset.i;
    if(qz.picked===q.a)qz.score++;else qz.wrong.push(q);renderQuiz();
  });
  if(p!==null)$("#qnext").onclick=()=>{qz.i++;qz.picked=null;renderQuiz()};
}

/* ---------- Narrated lesson ---------- */
let vp={slides:[],s:0,step:0,playing:false,muted:false,rate:1,token:0};
const hasTTS="speechSynthesis" in window;
function heVoice(){if(!hasTTS)return null;return speechSynthesis.getVoices().find(v=>(v.lang||"").toLowerCase().startsWith("he")||(v.lang||"").toLowerCase().startsWith("iw"))||null}
if(hasTTS)speechSynthesis.onvoiceschanged=()=>{if(state.tab==="video")renderHint()};
function buildVideo(){
  vp.slides=[];sel().forEach(c=>c.les.forEach((l,i)=>vp.slides.push({n:c.n,ct:c.t,t:l[0],b:l[1],first:i===0})));
  vp.s=0;vp.step=0;vp.playing=false;
}
function stepText(){
  const sl=vp.slides[vp.s];
  if(vp.step===0)return(sl.first?`פרק ${sl.n}. ${sl.ct}. `:"")+sl.t;
  return sl.b[vp.step-1];
}
function say(text,cb){
  const timer=()=>setTimeout(cb,Math.max(2000,text.length*70)/vp.rate);
  if(vp.muted||!hasTTS)return timer();
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang="he-IL";u.rate=vp.rate;
  const v=heVoice();if(v)u.voice=v;
  let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(t);cb()};
  const t=setTimeout(fin,text.length*160+4000);
  u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);
}
function renderVideo(){
  $("#view").innerHTML=`
  <div class="stage" id="stage"><div class="ring"></div><div class="ring b"></div>
    <div class="slabel" id="slabel"></div><div class="stitle" id="stitle"></div><ul class="sbul" id="sbul"></ul>
    <div class="bar"><i id="vbar"></i></div></div>
  <div class="ctrls">
    <button class="cbtn" id="vnext" aria-label="השקופית הקודמת">⏭</button>
    <button class="cbtn play" id="vplay" aria-label="ניגון"></button>
    <button class="cbtn" id="vprev" aria-label="השקופית הבאה">⏮</button>
  </div>
  <div class="ctrls">
    <button class="cbtn small" id="vmute"></button>
    <button class="cbtn small" id="vrate"></button>
  </div>
  <div class="hint" id="vhint"></div>`;
  /* RTL: the visually right button goes back */
  $("#vnext").onclick=()=>jump(-1);$("#vprev").onclick=()=>jump(1);
  $("#vplay").onclick=()=>vp.playing?pauseVideo():playVideo();
  $("#vmute").onclick=()=>{vp.muted=!vp.muted;if(hasTTS)speechSynthesis.cancel();renderCtrls();if(vp.playing){vp.token++;runStep()}};
  $("#vrate").onclick=()=>{vp.rate=vp.rate===1?1.25:vp.rate===1.25?0.85:1;renderCtrls()};
  vp.step=0;renderStage(true);renderCtrls();renderHint();
}
function renderStage(showAll){
  const sl=vp.slides[vp.s];if(!sl)return;
  $("#slabel").textContent=`פרק ${sl.n} · ${sl.ct}`;
  $("#stitle").textContent=sl.t;
  const shown=showAll?sl.b.length:vp.step;
  $("#sbul").innerHTML=sl.b.map((b,i)=>`<li class="${i<shown?"in":""} ${!showAll&&i===vp.step-1?"now":""}">${esc(b)}</li>`).join("");
  requestAnimationFrame(()=>{});
  const per=1/vp.slides.length;
  $("#vbar").style.width=((vp.s+(showAll?1:vp.step/(sl.b.length+1)))*per*100)+"%";
}
function renderCtrls(){
  if(!$("#vplay"))return;
  $("#vplay").textContent=vp.playing?"❚❚":"▶";
  $("#vplay").setAttribute("aria-label",vp.playing?"השהיה":"ניגון");
  $("#vmute").textContent=vp.muted?"🔇 בלי קול":"🔊 עם קול";
  $("#vrate").textContent="מהירות ×"+vp.rate;
}
function renderHint(){
  const h=$("#vhint");if(!h)return;
  if(!hasTTS)h.textContent="הדפדפן לא תומך בהקראה – השיעור יתקדם עם כתוביות בלבד.";
  else if(!heVoice())h.textContent="לא נמצא קול בעברית במכשיר. אפשר להוסיף קול עברי בהגדרות הנגישות, או לכבות קול ולהמשיך עם כתוביות.";
  else h.textContent=`${vp.slides.length} שקופיות. הקראה בקול של המכשיר.`;
}
function playVideo(){
  if(vp.s>=vp.slides.length-1&&vp.step>vp.slides[vp.s].b.length){vp.s=0}
  vp.playing=true;vp.step=0;renderCtrls();runStep();
}
function pauseVideo(){vp.playing=false;vp.token++;if(hasTTS)speechSynthesis.cancel();renderCtrls()}
function stopVideo(){vp.playing=false;vp.token++;if(hasTTS)speechSynthesis.cancel()}
function runStep(){
  const tok=++vp.token;renderStage(false);
  say(stepText(),()=>{
    if(tok!==vp.token||!vp.playing)return;
    const sl=vp.slides[vp.s];
    if(vp.step<sl.b.length){vp.step++}
    else if(vp.s<vp.slides.length-1){vp.s++;vp.step=0}
    else{vp.playing=false;vp.step=sl.b.length+1;renderStage(true);renderCtrls();$("#vhint").textContent="סוף השיעור. אפשר לעבור לבוחן כדי לבדוק מה נשאר.";return}
    setTimeout(()=>{if(tok===vp.token&&vp.playing)runStep()},vp.step===0?900:350);
  });
}
function jump(d){
  vp.s=Math.min(vp.slides.length-1,Math.max(0,vp.s+d));vp.step=0;
  if(vp.playing){if(hasTTS)speechSynthesis.cancel();runStep()}else renderStage(true);
}

updateTotals();renderChips();rebuild();
</script>
