let deck=[],shown=false,doneCount=0;
function newDeck(){deck=shuffle(pool().filter(e=>!onlyNew||!known.has(kid(e))));shown=false;doneCount=0}
function cards(){
  const v=$("#view");
  let h=`<label class="chk"><input type="checkbox" id="onlyNew" ${onlyNew?"checked":""}> רק תרגילים שעוד לא ידעתי</label>`;
  if(!deck.length){
    h+=`<div class="card" style="text-align:center"><div class="big">✓</div><p>סיימת את החבילה${doneCount?` (${doneCount} כרטיסיות)`:""}.</p><button class="btn" id="again">ערבוב והתחלה מחדש</button></div>`;
    v.innerHTML=h;$("#again").onclick=()=>{newDeck();cards()};
  }else{
    const e=deck[0];
    h+=`<div class="card"><div class="sec">${esc(e.s)} – ${he(e.s)}</div><div class="name">${esc(e.n)}</div>`;
    if(!shown){h+=`<p class="hint">נסי לומר בקול: ${e.sp?"קפיצים, ":""}מוצא, מה קורה בשאיפה ומה בנשיפה, ואילו שרירים עובדים.</p><div class="row"><button class="btn" id="show">הצגת התשובה</button></div>`}

    v.innerHTML=h;
    if(!shown)$("#show").onclick=()=>{shown=true;cards()};
    else{
      $("#yes").onclick=()=>{known.add(kid(e));save();updProg();deck.shift();doneCount++;shown=false;cards()};
      $("#no").onclick=()=>{known.delete(kid(e));save();updProg();deck.shift();deck.splice(Math.min(3,deck.length),0,e);shown=false;cards()};
    }
  }

}

let quiz=[],qi=0,score=0,answered=false;
function pickOpts(correct,all,n=4){const o=shuffle([...new Set(all)].filter(x=>x&&x!==correct)).slice(0,n-1);return shuffle([correct,...o])}
function makeQ(e){
  const Pl=pool(),A=EX();
  const types=[];
  if(!/^(מתחילים|מנח|אותו|כמו|מגלגלים)/.test(e.st))types.push("start");
  if(e.m)types.push("mus","mus");
  if(e.steps.some(s=>s[0]==="i"||s[0]==="e"))types.push("breath","breath");
  if(e.sp&&new Set(A.map(x=>x.sp)).size>=3)types.push("sp");
  if(sec==="all")types.push("sec");
  const t=types[Math.random()*types.length|0];
  if(t==="start"){const same=Pl.length>=4?Pl:A;return{q:"איזה תרגיל מתחיל כך?",text:e.st,ans:e.n,opts:pickOpts(e.n,shuffle(same.map(x=>x.n))),ltr:true,ex:e}}
  if(t==="mus")return{q:`אילו שרירים עיקריים עובדים ב-${e.n}?`,ans:e.m,opts:pickOpts(e.m,shuffle(A.map(x=>x.m))),ltr:true,mus:true,ex:e};
  if(t==="sp")return{q:`אילו קפיצים מומלצים ל-${e.n}?`,ans:e.sp,opts:pickOpts(e.sp,shuffle(A.map(x=>x.sp))),ex:e};
  if(t==="sec")return{q:`לאיזה פרק שייך ${e.n}?`,ans:e.s,opts:pickOpts(e.s,SECS()),ltr:true,sec:true,ex:e};
  const st=shuffle(e.steps.filter(s=>s[0]==="i"||s[0]==="e"))[0];
  return{q:`ב-${e.n}: שאיפה או נשיפה?`,text:st[1].replace(/^\([^)]*\)\s*/,""),ans:PILL[st[0]],opts:["שאיפה","נשיפה"],ex:e};
}
function newQuiz(){const Pl=shuffle(pool());quiz=[];for(let i=0;i<10;i++)quiz.push(makeQ(Pl[i%Pl.length]));qi=0;score=0;answered=false}
function optLabel(Q,o){if(Q.mus)return `${esc(o)}<small>${esc(musHe(o))}</small>`;if(Q.sec)return `${esc(o)}<small>${esc(he(o))}</small>`;return esc(o)}
function quizView(){
  const v=$("#view");
  if(qi>=quiz.length){
    v.innerHTML=`<div class="card" style="text-align:center"><div class="sec">התוצאה שלך</div><div class="big">${score}/${quiz.length}</div><p>${score>=9?"מצוין, את שולטת בחומר.":score>=6?"יפה מאוד. עוד סבב אחד ונגיע לשם.":"כדאי לעבור שוב על הכרטיסיות של הפרק הזה."}</p><button class="btn" id="again">עוד סבב</button></div>`;
    $("#again").onclick=()=>{newQuiz();quizView()};return;
  }
  const Q=quiz[qi];
  let h=`<div class="card"><div class="sec">שאלה ${qi+1} מתוך ${quiz.length} · ${score} נכונות</div><div class="q">${esc(Q.q)}</div>`;
  if(Q.text)h+=`<div class="qtext">${esc(Q.text)}</div>`;
  h+=`<div class="opts">`+Q.opts.map((o,i)=>`<button class="opt ${Q.ltr?"ltr":""}" data-i="${i}">${optLabel(Q,o)}</button>`).join("")+`</div><div id="fb"></div></div>`;
  v.innerHTML=h;
  v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(answered)return;answered=true;
    const pick=Q.opts[+b.dataset.i],ok=pick===Q.ans;if(ok)score++;
    v.querySelectorAll(".opt").forEach(x=>{x.disabled=true;const val=Q.opts[+x.dataset.i];if(val===Q.ans)x.classList.add("right");else if(x===b)x.classList.add("wrong")});
    $("#fb").innerHTML=`<p style="margin:14px 0 0;font-weight:700;color:var(${ok?"--ok":"--bad"})">${ok?"נכון!":"לא בדיוק. התשובה מסומנת בירוק."}</p><details style="margin-top:10px"><summary>לראות את ${esc(Q.ex.n)} במלואו</summary><div>${details(Q.ex)}</div></details><div class="row"><button class="btn" id="next">${qi===quiz.length-1?"לתוצאה":"השאלה הבאה"}</button></div>`;
    $("#next").onclick=()=>{qi++;answered=false;quizView()};
  });
}

};
let LS={li:0,i:0,el:0,run:false,opt:true,timer:null,last:0,spokeI:-1,warned:-1};
const VO={on:true,full:true,rate:1,he:null,en:null};
try{const v=JSON.parse(localStorage.getItem("pilates-voice")||"{}");if(typeof v.on==="boolean")VO.on=v.on;if(typeof v.full==="boolean")VO.full=v.full;if(v.rate)VO.rate=v.rate}catch(e){}
const saveVO=()=>{try{localStorage.setItem("pilates-voice",JSON.stringify({on:VO.on,full:VO.full,rate:VO.rate}))}catch(e){}};
const hasTTS="speechSynthesis" in window;
function pickVoices(){if(!hasTTS)return;const vs=speechSynthesis.getVoices();VO.he=vs.find(v=>/^(he|iw)/i.test(v.lang))||null;VO.en=vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;const n=document.getElementById("vnote");if(n)n.textContent=voiceNote()}
if(hasTTS){pickVoices();speechSynthesis.onvoiceschanged=pickVoices}
function voiceNote(){if(!hasTTS)return "הדפדפן הזה לא תומך בהקראה.";if(!VO.he)return "לא נמצא קול עברי במכשיר; ההקראה עלולה לא לעבוד. באייפון: הגדרות ← נגישות ← תוכן מוקרא ← קולות ← עברית.";return ""}
function sayParts(parts,cancel){
  if(!hasTTS||!VO.on)return;
  if(cancel)speechSynthesis.cancel();
  parts.forEach(([txt,lang])=>{
    String(txt).replace(/([.;!?])\s+/g,"$1\n").split("\n").filter(s=>s.trim()).forEach(s=>{
      const u=new SpeechSynthesisUtterance(s.replace(/[·]/g,","));
      u.lang=lang==="en"?"en-US":"he-IL";const v=lang==="en"?VO.en:VO.he;if(v)u.voice=v;u.rate=VO.rate;
      speechSynthesis.speak(u);
    });
  });
}
const speaking=()=>hasTTS&&(speechSynthesis.speaking||speechSynthesis.pending);
const findEx=x=>EX().find(y=>y.n===x.n&&(!x.s||y.s===x.s));
function speakItem(x,nx){
  if(x.tr){const p=[["מעבר. "+x.txt,"he"]];if(nx&&!nx.tr){p.push(["התרגיל הבא:","he"],[nx.n,"en"])}sayParts(p,true);return}
  const e=findEx(x);const p=[[x.n,"en"],[x.reps+".","he"]];
  if(e&&e.sp)p.push(["קפיצים: "+e.sp+".","he"]);
  if(VO.full&&e){p.push(["מוצא: "+e.st,"he"]);e.steps.forEach(([t,s])=>{if(t==="h")p.push([s+".","he"]);else p.push([(t==="n"?"":PILL[t]+": ")+s,"he"])})}
  p.push(["דגש: "+x.cue+".","he"]);
  sayParts(p,true);
}
const lessonItems=()=>{const L=(LESSONS[prog]||[])[LS.li];return L?L.items.filter(x=>LS.opt||!x.opt).map(x=>({...x,d:Math.round(x.d*(L.scale||1)/5)*5})):[]};
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function stopTimer(){if(LS.timer){clearInterval(LS.timer);LS.timer=null}LS.run=false;if(hasTTS)speechSynthesis.cancel()}
function tick(){const now=Date.now();LS.el+=(now-LS.last)/1000;LS.last=now;const it=lessonItems();
  if(LS.el>=it[LS.i].d){if(LS.i<it.length-1){LS.i++;LS.el=0}else{LS.el=it[LS.i].d;clearInterval(LS.timer);LS.timer=null;LS.run=false;sayParts([["כל הכבוד. סיימנו את השיעור. תודה רבה.","he"]],true)}}
  lessonUpdate()}
function play(){if(LS.run)return;LS.run=true;LS.last=Date.now();LS.timer=setInterval(tick,250);lessonUpdate()}
function jump(i){const it=lessonItems();LS.i=Math.max(0,Math.min(it.length-1,i));LS.el=0;LS.spokeI=-1;lessonView()}
function breathFor(x){
  if(x.tr)return null;const e=findEx(x);if(!e)return null;
  const st=e.steps.filter(s=>s[0]!=="h");if(!st.length)return null;
  const lens=st.map(s=>s[0]==="n"?8:4),cyc=lens.reduce((a,b)=>a+b,0);
  let t=LS.el%cyc,k=0;while(t>=lens[k]){t-=lens[k];k++}
  return {s:st[k],len:lens[k],k,cy:Math.floor(LS.el/cyc)};
}
function lessonView(){
  const v=$("#view");const Ls=LESSONS[prog]||[];
  if(!Ls.length){v.innerHTML=`<div class="card" style="text-align:center"><p>עוד אין שיעור מוכן ל${P().label}.</p><p class="hint">בקשי ממני לבנות אחד, ואוסיף אותו כאן.</p></div>`;return}
  if(LS.li>=Ls.length)LS.li=0;
  const L=Ls[LS.li],it=lessonItems();if(LS.i>=it.length)LS.i=0;
  const total=it.reduce((a,x)=>a+x.d,0);
  v.innerHTML=`<div class="lp">
  <div class="lpsel">${Ls.map((l,j)=>`<button data-li="${j}" aria-pressed="${j===LS.li}">${esc(l.level)}</button>`).join("")}</div>
  <div class="lphead"><div><div class="sec">${esc(L.title)}</div><div class="lptot">סה״כ ${fmt(total)} דק׳</div></div>
  <label class="chk" style="margin:0"><input type="checkbox" id="lopt" ${LS.opt?"checked":""}> כולל אופציונליים</label></div>
  <div class="lpvoice"><label class="chk" style="margin:0"><input type="checkbox" id="von" ${VO.on?"checked":""} ${hasTTS?"":"disabled"}> 🔊 קול מדריך</label>
  <select id="vfull" aria-label="אורך ההסבר"><option value="1" ${VO.full?"selected":""}>הסבר מלא</option><option value="0" ${VO.full?"":"selected"}>רק שם, חזרות ודגש</option></select>
  <select id="vrate" aria-label="מהירות"><option value="0.85">איטי</option><option value="1">רגיל</option><option value="1.15">מהיר</option></select>
  <div class="note" id="vnote">${voiceNote()}</div></div>
  <div class="lpbar" id="lpbar">${it.map((x,j)=>`<i data-j="${j}" style="flex:${x.d}" class="${x.tr?"tr":""}"></i>`).join("")}</div>
  <div class="card lpcard" id="lpcard"></div>
  <div class="lpctl"><button class="btn ghost" id="lprev" aria-label="הקודם">⏭</button><button class="btn" id="lplay"></button><button class="btn ghost" id="lnext" aria-label="הבא">⏮</button></div>
  <ol class="lplist" id="lplist">${it.map((x,j)=>`<li data-j="${j}" class="${x.tr?"tr":""}">${x.tr?`<span>↪ ${esc(x.txt)}</span>`:`<span class="en">${esc(x.n)}</span><span class="lpr">${esc(x.reps)}${x.opt?" · אופציונלי":""}</span>`}<span class="lpd">${fmt(x.d)}</span></li>`).join("")}</ol></div>`;
  $("#vrate").value=String(VO.rate);
  v.querySelectorAll(".lpsel button").forEach(b=>b.onclick=()=>{stopTimer();LS.li=+b.dataset.li;LS.i=0;LS.el=0;LS.spokeI=-1;lessonView()});
  $("#lopt").onchange=e=>{LS.opt=e.target.checked;stopTimer();LS.i=0;LS.el=0;LS.spokeI=-1;lessonView()};
  $("#von").onchange=e=>{VO.on=e.target.checked;saveVO();if(!VO.on&&hasTTS)speechSynthesis.cancel();else if(LS.run){LS.spokeI=-1}};
  $("#vfull").onchange=e=>{VO.full=e.target.value==="1";saveVO()};
  $("#vrate").onchange=e=>{VO.rate=+e.target.value;saveVO()};
  $("#lplay").onclick=()=>{if(LS.run){stopTimer();lessonUpdate()}else{if(LS.el<1)LS.spokeI=-1;else LS.spokeI=LS.i;
    if(hasTTS&&VO.on&&LS.spokeI===LS.i)sayParts([["ממשיכים.","he"]],true);
    play()}};
  $("#lprev").onclick=()=>{const r=LS.run;stopTimer();jump(LS.el>3?LS.i:LS.i-1);if(r)play()};
  $("#lnext").onclick=()=>{const r=LS.run;stopTimer();jump(LS.i+1);if(r)play()};
  v.querySelectorAll("#lplist li,#lpbar i").forEach(n=>n.onclick=()=>{const r=LS.run;stopTimer();jump(+n.dataset.j);if(r)play()});
  LS.lastI=-1;lessonUpdate();
}
function lessonUpdate(){
  const card=$("#lpcard");if(!card)return;
  const it=lessonItems(),x=it[LS.i],nx=it[LS.i+1];
  const total=it.reduce((a,y)=>a+y.d,0),done=it.slice(0,LS.i).reduce((a,y)=>a+y.d,0)+LS.el;
  const ended=LS.i===it.length-1&&LS.el>=x.d;
  $("#lplay").textContent=ended?"השיעור הסתיים 🎉":LS.run?"השהיה":(done>0?"המשך":"התחלת השיעור");
  document.querySelectorAll("#lpbar i").forEach((n,j)=>{n.className=(it[j].tr?"tr ":"")+(j<LS.i?"done":j===LS.i?"now":"")});
  document.querySelectorAll("#lplist li").forEach((n,j)=>n.classList.toggle("now",j===LS.i));
  const e=findEx(x),b=breathFor(x);
  if(LS.lastI!==LS.i){
    LS.lastI=LS.i;LS.lastK=null;
    const nxt=nx?`<div class="lpnext">הבא: ${nx.tr?esc(nx.txt):`<b class="en">${esc(nx.n)}</b>`}</div>`:`<div class="lpnext">התרגיל האחרון בשיעור</div>`;
    card.innerHTML=x.tr
      ?`<div class="sec">מעבר</div><div class="lptr">${esc(x.txt)}</div><div class="lptime"><span id="lpleft"></span></div>${nx&&!nx.tr?`<div class="lpnext">הבא: <b class="en">${esc(nx.n)}</b></div>`:""}`
      :`<div class="sec">${esc(x.sec)} · ${LS.i+1}/${it.length}</div><div class="name">${esc(x.n)}</div>
        <div class="lpreps">${esc(x.reps)}${x.opt?" · אופציונלי":""}</div>
        ${e&&e.sp?`<div style="margin-top:6px"><span class="springs">קפיצים: ${esc(e.sp)}</span></div>`:""}
        <div class="lpbreath"><div class="orb" id="orb"></div><div class="orbtxt"><span class="pill" id="bpill"></span><div id="btxt"></div></div></div>
        <div class="lpcue"><b>דגש:</b> ${esc(x.cue)}</div>
        <div class="lptime"><span id="lpleft"></span> · נשארו בשיעור <span id="lptot"></span></div>
        ${nxt}${e?`<details><summary>התרגיל המלא</summary><div>${details(e)}</div></details>`:""}`;
  }
  if(LS.run&&LS.spokeI!==LS.i){LS.spokeI=LS.i;LS.warned=-1;speakItem(x,nx)}
  const left=$("#lpleft");if(left)left.textContent=fmt(x.d-LS.el);
  const tot=$("#lptot");if(tot)tot.textContent=fmt(total-done);
  if(LS.run&&!x.tr&&x.d-LS.el<=10&&x.d>30&&LS.warned!==LS.i&&!speaking()){LS.warned=LS.i;sayParts([["עוד עשר שניות.","he"]])}
  const orb=$("#orb");
  if(orb){
    if(b){
      const key=b.k+"|"+b.cy;
      if(LS.lastK!==key){
        LS.lastK=key;const t=b.s[0];
        $("#bpill").className="pill "+t;$("#bpill").textContent=PILL[t];$("#btxt").textContent=b.s[1];
        orb.style.transitionDuration=b.len+"s";orb.className="orb "+t+(LS.run?" go":"");
        if(LS.run&&LS.spokeI===LS.i&&!speaking()&&t!=="n")sayParts([[PILL[t],"he"]]);
      }
      if(!LS.run)orb.classList.remove("go");else if(!orb.classList.contains("go"))orb.classList.add("go");
    }else{$("#bpill").textContent="";$("#btxt").textContent="";orb.className="orb"}
  }
}
function render(reset){
  stopTimer();
  const lesson=tab==="lesson";
  $("#filter").style.display=lesson?"none":"";
  if(tab==="cards"){if(reset)newDeck();cards()}
  else if(tab==="quiz"){if(reset)newQuiz();quizView()}
  else if(lesson){if(reset){LS.i=0;LS.el=0}lessonView()}
  else list();
}
