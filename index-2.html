<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>פילאטיס – תרגול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#F2F1F7;--surface:#FFFFFF;--ink:#23213A;--muted:#6B6880;--line:#DCD9E8;
  --accent:#4A3F9E;--accent-ink:#FFFFFF;--in:#1F7A9C;--in-bg:#E1F1F7;--ex:#C0436A;--ex-bg:#F9E3EA;
  --ok:#2E8B57;--ok-bg:#E2F3E9;--bad:#B4372F;--bad-bg:#F8E1DF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16151F;--surface:#211F2E;--ink:#EDEBF7;--muted:#A19DB8;--line:#35324A;
  --accent:#9C90F0;--accent-ink:#16151F;--in:#5BC0E0;--in-bg:#16303A;--ex:#F07FA0;--ex-bg:#3A1C27;
  --ok:#5CC98A;--ok-bg:#173326;--bad:#F08A80;--bad-bg:#3B1C1A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16151F;--surface:#211F2E;--ink:#EDEBF7;--muted:#A19DB8;--line:#35324A;
  --accent:#9C90F0;--accent-ink:#16151F;--in:#5BC0E0;--in-bg:#16303A;--ex:#F07FA0;--ex-bg:#3A1C27;
  --ok:#5CC98A;--ok-bg:#173326;--bad:#F08A80;--bad-bg:#3B1C1A;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-family:"Secular One","Assistant",system-ui,sans-serif;font-weight:400;font-size:1.9rem;line-height:1.15;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 14px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 16px}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;padding:8px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface)}
select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:10px}
label.chk{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px}
.sec{color:var(--muted);font-size:.9rem}
.name{font-family:"Secular One","Assistant",system-ui,sans-serif;font-size:2rem;line-height:1.15;margin:4px 0 12px;direction:ltr;text-align:right}
.hint{color:var(--muted)}
.lbl{font-weight:700;margin:14px 0 4px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:flex;gap:10px;align-items:flex-start}
.pill{flex:none;font-size:.82rem;font-weight:700;padding:2px 10px;border-radius:999px;margin-top:2px;white-space:nowrap}
.pill.i{background:var(--in-bg);color:var(--in)}
.pill.e{background:var(--ex-bg);color:var(--ex)}
.pill.n{background:var(--line);color:var(--ink)}
.steps li.h{font-weight:700;color:var(--accent);margin-top:6px}
.note{color:var(--muted);font-size:.95rem;margin-top:10px}
.mus{direction:ltr;text-align:right;font-weight:600;color:var(--accent)}
.row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.no{background:var(--ex-bg);color:var(--ex)}
.btn.yes{background:var(--ok-bg);color:var(--ok)}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.count{color:var(--muted);font-size:.9rem;text-align:center;margin-top:12px}
.q{font-weight:700;font-size:1.1rem;margin:6px 0 4px}
.qtext{background:var(--bg);border-radius:10px;padding:10px 12px;margin:8px 0}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{font:inherit;text-align:right;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer}
.opt.ltr{direction:ltr;text-align:right}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.big{font-family:"Secular One","Assistant",system-ui,sans-serif;font-size:3rem;line-height:1;margin:6px 0}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
summary{cursor:pointer;padding:12px 14px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
summary .en{direction:ltr}
summary .tick{color:var(--ok)}
details>div{padding:0 14px 14px}
h2{font-family:"Secular One","Assistant",system-ui,sans-serif;font-weight:400;font-size:1.25rem;margin:20px 0 8px}
.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.9rem;margin-bottom:14px}
.reset{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;margin-top:24px}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}

/* program switch */
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
.prog button{font:inherit;font-family:"Secular One","Assistant",system-ui,sans-serif;font-size:.98rem;padding:9px 4px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;line-height:1.2}
.prog button small{display:block;font-family:"Assistant",system-ui,sans-serif;font-size:.72rem;font-weight:600}
.prog button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
:root{--accent-soft:#ECEAF8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent-soft:#2A2740}}
:root[data-theme="dark"]{--accent-soft:#2A2740}
body[data-prog="mat"]{--accent:#4A3F9E;--accent-soft:#ECEAF8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-prog="mat"]{--accent:#9C90F0;--accent-soft:#2A2740}}
:root[data-theme="dark"] body[data-prog="mat"]{--accent:#9C90F0;--accent-soft:#2A2740}
body[data-prog="reformer"]{--accent:#9A5B1E;--accent-soft:#F6ECE1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-prog="reformer"]{--accent:#E3AA6B;--accent-soft:#3A2A1A}}
:root[data-theme="dark"] body[data-prog="reformer"]{--accent:#E3AA6B;--accent-soft:#3A2A1A}
body[data-prog="tower"]{--accent:#1F7A68;--accent-soft:#E0F2EE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-prog="tower"]{--accent:#6CCBB6;--accent-soft:#163530}}
:root[data-theme="dark"] body[data-prog="tower"]{--accent:#6CCBB6;--accent-soft:#163530}
body[data-prog="chair"]{--accent:#B03A48;--accent-soft:#F8E4E7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-prog="chair"]{--accent:#F08A97;--accent-soft:#3A1C21}}
:root[data-theme="dark"] body[data-prog="chair"]{--accent:#F08A97;--accent-soft:#3A1C21}
body[data-prog="legw"]{--accent:#5F6E12;--accent-soft:#EEF2D8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-prog="legw"]{--accent:#C4D36A;--accent-soft:#262B12}}
:root[data-theme="dark"] body[data-prog="legw"]{--accent:#C4D36A;--accent-soft:#262B12}
body[data-prog="magic"]{--accent:#8E3B8A;--accent-soft:#F5E4F4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-prog="magic"]{--accent:#E39BDE;--accent-soft:#341A33}}
:root[data-theme="dark"] body[data-prog="magic"]{--accent:#E39BDE;--accent-soft:#341A33}
body[data-prog="ladder"]{--accent:#2563A8;--accent-soft:#E2ECF8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-prog="ladder"]{--accent:#7DB3F0;--accent-soft:#16253A}}
:root[data-theme="dark"] body[data-prog="ladder"]{--accent:#7DB3F0;--accent-soft:#16253A}
body[data-prog="step"]{--accent:#B4521A;--accent-soft:#FBE9DD}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-prog="step"]{--accent:#F2A06B;--accent-soft:#3A2214}}
:root[data-theme="dark"] body[data-prog="step"]{--accent:#F2A06B;--accent-soft:#3A2214}
.mlist{display:grid;gap:4px}
.mrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.mrow .en{direction:ltr;font-weight:700;color:var(--accent)}
.mrow .he{color:var(--ink)}
.springs{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:8px;padding:2px 10px;font-size:.92rem}
.opt small{display:block;color:var(--muted);font-size:.85rem;direction:rtl;text-align:right}
.lphead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.lptot{font-family:"Secular One","Assistant",system-ui,sans-serif;font-size:1.3rem}
.lpbar{display:flex;gap:2px;height:10px;margin-bottom:12px;border-radius:5px;overflow:hidden}
.lpbar i{background:var(--line);cursor:pointer;min-width:2px}
.lpbar i.tr{opacity:.45}
.lpbar i.done{background:var(--accent);opacity:.55}
.lpbar i.now{background:var(--accent)}
.lpcard{min-height:340px}
.lpreps{font-weight:700;color:var(--accent);margin-top:-6px}
.lpbreath{display:flex;align-items:center;gap:18px;margin:16px 0 6px;min-height:120px}
.orb{flex:none;width:110px;height:110px;border-radius:50%;background:var(--line);transform:scale(.6);transition-property:transform,background-color;transition-timing-function:ease-in-out}
.orb.i{background:var(--in-bg);box-shadow:inset 0 0 0 3px var(--in)}
.orb.e{background:var(--ex-bg);box-shadow:inset 0 0 0 3px var(--ex)}
.orb.n{background:var(--accent-soft);box-shadow:inset 0 0 0 3px var(--accent)}
.orb.e{transform:scale(1)}
.orb.i.go{transform:scale(1)}
.orb.e.go{transform:scale(.55)}
.orb.n.go{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.6)}50%{transform:scale(.95)}}
.orbtxt{flex:1;min-width:0}
.orbtxt .pill{display:inline-block;margin-bottom:6px}
.lpcue{margin-top:8px}
.lptime{color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}
.lptime #lpleft{font-family:"Secular One","Assistant",system-ui,sans-serif;font-size:1.6rem;color:var(--ink)}
.lpnext{margin-top:6px;color:var(--muted)}
.lptr{font-size:1.25rem;font-weight:700;margin:14px 0}
.lpctl{display:flex;gap:10px;margin:12px 0 16px}
.lpctl .btn.ghost{flex:0 0 64px;font-size:1.2rem}
.lplist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.lplist li{display:flex;gap:8px;align-items:baseline;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.lplist li.tr{background:transparent;border-style:dashed;color:var(--muted);font-size:.92rem}
.lplist li.now{border-color:var(--accent);background:var(--accent-soft)}
.lplist .en{direction:ltr;font-weight:600}
.lplist .lpr{color:var(--muted);font-size:.88rem;flex:1}
.lplist li.tr span:first-child{flex:1}
.lplist .lpd{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.orb{transition:none!important;animation:none!important}}
.lpsel{display:flex;gap:6px;margin-bottom:10px}
.lpsel button{flex:1;font:inherit;font-weight:700;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.lpsel button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.lpvoice{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px}
.lpvoice select{width:auto;margin:0;padding:6px 8px}
.lpvoice .note{flex-basis:100%;margin:0}
.lpvoice .note:empty{display:none}
.sitenav{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:10px 0 12px;border-radius:12px;background:var(--line)}
.sitenav a{display:block;text-align:center;padding:8px 6px;border-radius:9px;font-weight:700;text-decoration:none;color:var(--muted)}
.sitenav a[aria-current="page"]{background:var(--surface);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <nav class="sitenav" aria-label="חלקי האתר"><a href="./" aria-current="page">תרגילים ושיעורים</a><a href="theory.html">עיוני</a></nav>
  <div class="prog" id="progs" role="group" aria-label="סוג אימון"></div>
  <h1 id="title">פילאטיס מזרן</h1>
  <p class="sub" id="prog"></p>
  <div class="bar"><i id="pbar"></i></div>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="cards" aria-selected="true">כרטיסיות</button>
    <button role="tab" data-tab="quiz" aria-selected="false">מבחן</button>
    <button role="tab" data-tab="list" aria-selected="false">עיון</button>

  </div>
  <select id="filter" aria-label="פרק"></select>

  <main id="view"></main>
  <button class="reset" id="reset">איפוס ההתקדמות</button>
</div>
<script>
const MAT=[
{n:"Pelvic Curl",s:"Warm Up",st:"שכיבה על הגב, גוף במנח נטרלי, ברכיים כפופות, כפות רגליים על המזרן ברוחב אגן, ידיים לצידי הגוף, כפות הידיים כלפי מעלה.",steps:[["e","אוספים בטן, מגלגלים את האגן ל-PPT ומנתקים מהמזרן חוליה אחר חוליה עד קו ישר מהכתפיים ועד הברכיים."],["i","נשארים במקום ומאריכים את עמוד השדרה, ברכיים מצביעות קדימה."],["e","מניחים את החוליות אחת אחרי השנייה עד מנח נטרלי של הגב והאגן."]],note:"מתבצע בשני מחזורי אוויר.",m:"Hamstrings"},
{n:"Shoulder Bridge",s:"Warm Up",st:"מתחילים ממנח Pelvic Curl.",steps:[["h","הכנה"],["i","במקום."],["e","אוספים בטן ומנתקים רגל אחת."],["i","מניחים את הרגל בחזרה על המזרן."],["e","מנתקים רגל שנייה וכך ממשיכים."],["h","התרגיל המלא"],["e","מנתקים רגל אחת ומיישרים אותה אל התקרה בפלקס."],["i","מורידים את הרגל ישרה לכיוון המזרן בפוינט."]],note:"חוזרים מספר פעמים לכל רגל, שמים לב שהאגן לא משתנה.",m:"Hamstrings + Hip Flexors"},
{n:"Single Leg Lifts",s:"Warm Up",st:"שכיבה על הגב, רגליים כפופות, כפות רגליים על המזרן ברוחב אגן.",steps:[["e","אוספים בטן ומרימים רגל אחת ל-90 מעלות."],["i","מורידים את הרגל בחזרה אל המזרן."],["e","מרימים את הרגל השנייה וכך ממשיכים."]],m:"Hip Flexors"},
{n:"Leg Changes",s:"Warm Up",st:"מתחילים במנח Single Leg Lifts.",steps:[["i","מורידים רגל אל המזרן תוך כדי הרמת הרגל השנייה ל-90 מעלות."],["e","מחליפים בין הרגליים."]],note:"החלפה בשאיפה והחלפה בנשיפה.",m:"Hip Flexors"},
{n:"Spine Twist Supine",s:"Warm Up",st:"שכיבה על הגב, גב נטרלי, רגליים כפופות וצמודות ב-90 מעלות, פוינט, ידיים ישרות לצדדים, כפות ידיים לתקרה (או מרפקים כפופים וידיים על הצלעות).",steps:[["i","מניעים את הרגליים לצד אחד, מאריכים את הצד הנגדי של הגב והמותן."],["e","אוספים בטן ומחזירים את הרגליים למרכז."],["i","מניעים לצד השני וכך ממשיכים."]],note:"בית החזה והצלעות נשארים במרכז לאורך כל התרגיל.",m:"Abdominals Obliques"},
{n:"Chest Lift",s:"Warm Up",st:"שכיבה על הגב, גב נטרלי, רגליים כפופות וצמודות, כפות רגליים על המזרן, ידיים שלובות מאחורי הראש, מרפקים בזווית העיניים.",steps:[["e","מבצעים Imprinting, אוספים בטן ומרימים בית חזה וראש לכפיפה."],["i","מעמיקים את הכפיפה עוד קצת."],["e","מניחים את בית החזה בחזרה על המזרן."]],note:"מתבצע בשני מחזורי אוויר.",m:"Rectus Abdominus"},
{n:"Chest Lift With Rotation",s:"Warm Up",st:"מתחילים במנח Chest Lift.",steps:[["e","מסתובבים עם בית החזה לפיתול לצד אחד."],["i","חוזרים למרכז ומתארכים בלי להניח את הראש."],["e","מסתובבים לצד השני וכך ממשיכים."]],m:"Abdominals Obliques"},
{n:"Hundreds",s:"Abdominal Work",st:"שכיבה על הגב, רגליים כפופות על המזרן, ידיים ישרות לאחור על המזרן מעבר לראש.",steps:[["h","הכנה"],["e","מרימים ידיים לתקרה, אוספים בטן, Imprinting בגב התחתון, בית חזה לכפיפה, ידיים עוברות לפנים, רגליים מתיישרות ל-60 מעלות."],["i","חוזרים כל הדרך למנח ההתחלתי."],["h","התרגיל המלא"],["n","נשארים בכפיפה: נשימות כלב, 5 בשאיפה ו-5 בנשיפה, עם ניעור ידיים למעלה ולמטה ואיסוף בטן. 100 ניעות."]],note:"אפשר לבצע את ההכנה גם עם רגליים ישרות לתקרה או מונחות על המזרן.",m:"Rectus Abdominus"},
{n:"Roll Up",s:"Abdominal Work",st:"שכיבה על הגב, רגליים ישרות וצמודות, פוינט, ידיים ישרות לאחור, אגודלים לכיוון המזרן מעבר לראש.",steps:[["i","מרימים ידיים וראש, מבט קדימה, ידיים פונות לפנים."],["e","אוספים בטן ועולים חוליה אחר חוליה עד ישיבה, כתפיים מעל האגן, הגב נשאר עגול."],["i","ללא תנועה."],["e","מגלגלים את החוליות בחזרה אחת אחרי השנייה עד המנח ההתחלתי."]],m:"Rectus Abdominus + Hip Flexors"},
{n:"Neck Pull",s:"Abdominal Work",st:"שכיבה על הגב, רגליים ישרות וצמודות, ידיים שלובות מאחורי הראש, מרפקים בזווית העיניים.",steps:[["i","מרימים את הראש עם הידיים, מבט קדימה."],["e","אוספים בטן ומנתקים חוליה אחר חוליה בגב עגול עד שהמצח נוגע ברגליים."],["i","מיישרים את הגב קדימה ועולים בגב ישר עד הטיה לאחור."],["e","מניחים חוליה אחר חוליה עד למנח המוצא."]],m:"Rectus Abdominus + Hip Flexors"},
{n:"Double Leg Stretch",s:"Abdominal Work",st:"שכיבה על הגב, ידיים מחזיקות את הברכיים ב-90 מעלות.",steps:[["e","הרגליים דוחפות קדימה, הבטן נאספת, בית החזה והראש מתנתקים מהמזרן."],["i","מיישרים רגליים ל-45 מעלות קדימה, ידיים לאחור לצד האוזניים."],["e","מעגל ידיים לצדדים, מכופפים ברכיים, ידיים חוזרות לברכיים, תוך העמקת עליית החזה."]],m:"Rectus Abdominus"},
{n:"Single Leg Stretch",s:"Abdominal Work",st:"שכיבה על הגב, רגל אחת ישרה על המזרן ורגל שנייה ב-90 מעלות, ידיים אוחזות בברך הכפופה.",steps:[["e","הרגל הכפופה דוחפת קדימה, בית החזה והראש מתנתקים, הרגל הישרה עולה עד שכפות הרגליים באותו גובה."],["i","שאיפה קצרה במקום."],["e","מחליפים בין הרגליים, הידיים אוחזות בברך השנייה."]],note:"כל ההחלפות בנשיפה; נשימות קצרות בדגש על הנשיפה.",m:"Rectus Abdominus"},
{n:"Crisscross",s:"Abdominal Work",st:"מתחילים מהמנח של Single Leg Stretch, ידיים שלובות מאחורי הראש.",steps:[["e","עם החלפת הרגליים מבצעים פיתול של הבטן, בית החזה מסתובב לצד אחד."],["i","שאיפה קצרה בין הנשיפות."],["e","מחליפים לצד השני."]],note:"כל ההחלפות בנשיפה; נשימות קצרות בדגש על הנשיפה.",m:"Abdominals Obliques"},
{n:"Hamstring Pull 1+2+3",s:"Abdominal Work",st:"שכיבה על הגב, רגל אחת ישרה לתקרה בפלקס והשנייה ישרה על המזרן בפוינט, ידיים אוחזות בשוק העליונה, בית חזה בכפיפה, צוואר בהמשך לגב.",steps:[["e","(2 נשיפות קצרות) שלב 1: הידיים מושכות את הרגל העליונה לכיוון החזה בשתי ניעות."],["i","מחליפים בין הרגליים."],["n","שלב 2: אותה תנועת רגליים, ידיים שלובות מאחורי הראש, מרפקים בזווית העיניים, חזה למעלה בכפיפה."],["n","שלב 3: מוסיפים אלכסונים, החזה פונה אל הרגל שעולה."]],m:"Rectus Abdominus + Hip Flexors"},
{n:"Roll Like A Ball",s:"Abdominal Work",st:"ישיבה עם רגליים כפופות על המזרן, ידיים אוחזות בשוקיים, מעט מעל הקרסול.",steps:[["e","מקמרים את הגב התחתון, אוספים בטן, הידיים מתיישרות וכפות הרגליים מתנתקות. שיווי משקל במנח הכדור."],["i","מתגלגלים לאחור."],["e","מתגלגלים לפנים בחזרה אל שיווי המשקל."]],m:"Rectus Abdominus"},
{n:"Seal Puppy",s:"Abdominal Work",st:"ישיבה, אוחזים את כפות הרגליים מתחת לקרסול, שיווי משקל, כפות הרגליים בגובה העיניים.",steps:[["i","שלוש מחיאות כפיים עם כפות הרגליים ומתגלגלים לאחור."],["e","שלוש מחיאות ומתגלגלים חזרה לפנים, שוב שיווי משקל בישיבה."]],m:"Rectus Abdominus"},
{n:"Open Leg Rocker",s:"Abdominal Work",st:"ישיבה בשיווי משקל, ידיים ישרות אוחזות בקרסוליים, רגליים ישרות למעלה ברוחב המזרן.",steps:[["i","מתגלגלים עם עמוד השדרה לאחור, הרגליים והידיים נשארות ישרות."],["e","חוזרים לפנים, הבטן נאספת ומוצאים שיווי משקל בישיבה."]],m:"Rectus Abdominus + Back Extensors"},
{n:"Crab",s:"Abdominal Work",st:"עומדים על הברכיים, ראש מונח על המזרן, גב עגול, רגליים כפופות ושלובות באוויר, ידיים אוחזות בקרסוליים.",steps:[["i","מתגלגלים לאחור עד שהרגליים מעבר לראש, מחליפים את שילוב הרגליים."],["e","מתגלגלים לפנים עד שהראש על המזרן, למתיחה בצוואר."]],m:"Rectus Abdominus"},
{n:"Teaser 1+2+3",s:"Abdominal Work",st:"שכיבה על הגב, ידיים ישרות לאחור, רגליים ישרות על המזרן.",steps:[["h","הכנה"],["e","מרימים ידיים וראש קדימה לכפיפה."],["i","מיישרים גב ומנתקים רגליים עד שכפות הרגליים בגובה העיניים, ידיים לפנים בגובה הכתפיים."],["i","במקום."],["e","מקמרים את הגב התחתון מעט לאחור עד נגיעה קלה במזרן, השכמות באוויר."],["i","עולים חזרה ל-Teaser, הגב מתיישר."],["h","התרגיל המלא (מתחילים ב-Teaser)"],["e","1: יורדים חוליה אחר חוליה, ידיים אחורה מעבר לראש, רגליים נשארות ב-60 מעלות."],["i","עולים בחזרה ל-Teaser."],["e","2: מורידים את הרגליים לרצפה ישרות בפוינט, חזה וידיים ללא תנועה."],["i","מרימים את הרגליים בחזרה."],["e","3: יורדים כל הדרך לשכיבה, ידיים מאחורי הראש, רגליים למזרן."],["i","עולים בחזרה ל-Teaser."]],note:"את Teaser 3 אפשר לבצע גם בשני מחזורי אוויר לדיוק מקסימלי.",m:"Rectus Abdominus + Hip Flexors"},
{n:"Hip Circles",s:"Abdominal Work",st:"ישיבה שלמה, רגליים ישרות וצמודות, קצות האצבעות על המזרן מאחורי הגב, ידיים ישרות פונות לאחור, גב זקוף.",steps:[["h","הכנה"],["e","מנתקים את הרגליים בלי לשנות את מנח הגב, עד גובה העיניים."],["i","במקום."],["e","מורידים רגליים לצד אחד ומתחילים לצייר 8."],["i","מרימים רגליים מהצד השני וממשיכים את ה-8."],["h","התרגיל המלא"],["n","מנתקים את הידיים ומיישרים לפנים; הידיים מציירות 8 בכיוון ההפוך לרגליים (כמו אינפיניטי). הנשימה זהה להכנה."]],m:"Rectus Abdominus + Abdominals Obliques + Hip Flexors"},
{n:"Leg Circles",s:"Hip Work",st:"שכיבה על הגב, ידיים פרוסות לצדדים או על הצלעות, רגל אחת ישרה על המזרן, השנייה ישרה לתקרה בפלקס.",steps:[["h","הכנה"],["i","הרגל הישרה נפתחת לצד בלי לתת לאגן להתנתק מהמזרן."],["e","הרגל חוזרת למרכז או ממשיכה פנימה."],["h","התרגיל המלא"],["e","אוספים בטן ומבצעים מעגל עם הרגל."],["i","מבצעים מעגל נוסף לאותו כיוון."]],note:"מעגל בנשיפה ומעגל בשאיפה; אחרי כמה פעמים מחליפים כיוון, ואז רגל.",m:"Hip Flexors"},
{n:"Cat Stretch",s:"Spinal Articulation",st:"עמידת שש, כפות ידיים מתחת לכתפיים, ברכיים מתחת למפרקי הירך, אגן ועמוד שדרה במנח נטרלי.",steps:[["i","במקום."],["e","אוספים בטן ומקמרים את הגב, מבט פנימה, צוואר בהמשך לגב."],["i","מקערים את הגב, פותחים בית חזה ומרימים ראש, מבט קדימה."]],note:"אפשר גם בהפרדה: רק גב עליון או רק גב תחתון.",m:"Rectus Abdominus + Spine Extensors"},
{n:"Roll Over",s:"Spinal Articulation",st:"שכיבה על הגב, רגליים ישרות וצמודות ב-60 מעלות, פוינט.",steps:[["i","רגליים עולות ל-90 מעלות."],["e","מנתקים מהמזרן חוליה אחר חוליה ומעבירים רגליים ישרות מעבר לראש."],["i","רגליים נפתחות לרוחב כתפיים, הופכות לפלקס ונוגעות במזרן מאחורי הראש."],["e","מניחים חוליה אחר חוליה, רגליים נמוכות ככל האפשר, ובסוף חוזרות ל-60 מעלות, פוינט וצמודות."]],note:"פעם כך ופעם הפוך (לאחור ברוחב כתפיים, חזרה לפנים צמודות).",m:"Rectus Abdominus + Hip Flexors"},
{n:"Jack Knife",s:"Spinal Articulation",st:"מתחילים את התרגיל ב-Roll Over.",steps:[["i","הופכים לפלקס, נוגעים ברצפה מאחור עם האצבעות, ואז מרימים רגליים לתקרה בפוינט למנח נר."],["e","מניחים חוליה אחר חוליה, רגליים ישרות לתקרה, עד אגן נטרלי."],["i","מעגל קטן של הרגליים והורדה ל-60 מעלות."]],m:"Rectus Abdominus + Hip Flexors"},
{n:"Control Balance",s:"Spinal Articulation",st:"מתחילים ב-Roll Over, ידיים ישרות לאחור מחזיקות את כפות הרגליים.",steps:[["i","רגל אחת עולה ישרה לתקרה בפוינט."],["e","בטן נאספת ורגליים מחליפות מקום תוך שיווי משקל: עליונה בפוינט, תחתונה בפלקס, הידיים מחזיקות את הרגל התחתונה."]],m:"Rectus Abdominus + Hip Extensors"},
{n:"Corkscrew",s:"Spinal Articulation",st:"שכיבה על הגב, ידיים לצידי הגוף, רגליים ישרות בפלקס ב-90 מעלות לתקרה.",steps:[["i","מטים את הרגליים לצד אחד, הצלעות נשארות על המזרן."],["e","הופכים לפוינט ומניעים את הרגליים במעגל דרך 60 מעלות, חזרה למרכז ולפלקס."]],note:"מבצעים לצד השני וכך ממשיכים.",m:"Rectus Abdominus + Hip Flexors"},
{n:"Corkscrew Advanced",s:"Spinal Articulation",st:"מתחילים מאותו מנח של Corkscrew.",steps:[["e","מעגל רגליים אחורה מעבר לראש, פלקס, האגן והחוליות מתנתקים למנח Roll Over."],["i","הופכים לפוינט וממשיכים את המעגל קדימה עד 60 מעלות."]],note:"חצי מעגל בנשיפה בפלקס וחצי בשאיפה בפוינט.",m:"Rectus Abdominus + Hip Flexors"},
{n:"Boomerang",s:"Spinal Articulation",st:"ישיבה עם רגליים ישרות לפנים, רגל מונחת על השנייה, גב עגול, ידיים לצידי הרגליים.",steps:[["e","מתגלגלים לאחור ומרימים רגליים עד שמקבילות לרצפה מעבר לראש."],["i","מחליפים את שילוב הרגליים."],["e","מתגלגלים לפנים עד מנח Teaser."],["i","ידיים עוברות במעגל אל מאחורי הגב, אצבעות על המזרן, גב מתארך, גובה הרגליים כמו ב-Teaser."],["e","רגליים יורדות, הגב עולה ישר לישיבה, ידיים מציירות מעגל קדימה והגב מתעגל למנח ההתחלתי."]],m:"Rectus Abdominus + Hip Flexors"},
{n:"Side Leg Lift",s:"Leg Work",st:"שכיבה על הצד, יד על המזרן כף כלפי מעלה, ראש על היד, אגן מעט אחורה מקו הגוף, גב ישר, רגליים ישרות בהמשך לגוף, כפות ידיים ורגליים באותו קו.",steps:[["i","מרימים את הרגל העליונה בפלקס לגובה מפרק הירך."],["e","מאריכים את העליונה לפוינט מעבר לתחתונה, אוספים בטן, מרימים את התחתונה ומצמידים לעליונה בלי לשנות את מנח הגב."],["i","מניחים את התחתונה על המזרן ומחזירים את העליונה לפלקס."]],m:"Hip Adductors"},
{n:"Side Kick",s:"Leg Work",st:"שכיבה על הצד על האמה, כף היד התחתונה פונה קדימה, יד עליונה ישרה למעלה בהמשך ליד התחתונה, רגל תחתונה כפופה, רגל עליונה ישרה בגובה מפרק הירך. מרפק, אגן וכף רגל באותו קו.",steps:[["e","(2 נשיפות קצרות) שתי בעיטות קדימה עם הרגל העליונה, פלקס."],["i","(2 שאיפות קצרות) שתי בעיטות לאחור, פוינט."]],m:"Gluteus Maximus + ITB"},
{n:"Side Kick Kneeling",s:"Leg Work",st:"עמידה על ברך אחת ויד אחת על הצד, יד וברך באותו קו, כף היד פונה הצידה, יד עליונה ישרה למעלה, רגל עליונה בגובה מפרק הירך.",steps:[["e","(2 נשיפות קצרות) שתי בעיטות קדימה, פלקס."],["i","(2 שאיפות קצרות) שתי בעיטות לאחור, פוינט."]],m:"Gluteus Maximus + ITB"},
{n:"Front Support",s:"Full Body Integration",st:"עמידת “פלנק”, כפות ידיים מתחת לכתפיים, רגליים ישרות לאחור, פלקס על המזרן, אגן ועמוד שדרה נטרליים.",steps:[["i","מכופפים ברך אחת לנגיעה קלה במזרן, בלי לשנות את מנח האגן."],["e","מיישרים את הרגל בחזרה."],["i","מכופפים רגל שנייה."]],note:"ממשיכים פעם ימין ופעם שמאל, מספר חזרות.",m:"Transverse Abdominus"},
{n:"Leg Pull Front",s:"Full Body Integration",st:"מתחילים ממנח Front Support.",steps:[["e","מנתקים רגל אחת בפוינט ישרה לאחור, בלי לשנות את מנח האגן."],["i","מורידים את הרגל עד שקצות האצבעות נוגעות במזרן, וכך ממשיכים."]],m:"Hip Extensors + Transverse Abdominus"},
{n:"Push Up",s:"Full Body Integration",st:"מנח Front Support.",steps:[["i","כופפים מרפקים."],["e","מיישרים מרפקים בחזרה. חוזרים 3 פעמים."],["i","מעבירים משקל לרגליים לצורת פירמידה וצועדים עם הידיים 3 צעדים לאחור עד הרגליים."],["e","עולים חוליה אחר חוליה עד עמידה ישרה."],["i","ידיים עולות למעלה, נפתחות ויורדות."],["e","יורדים חוליה אחר חוליה עד שהידיים על המזרן."],["i","צועדים 3 צעדים קדימה עד Front Support."]],note:"חוזרים על הרצף מספר פעמים.",m:"Triceps + Transverse Abdominus"},
{n:"Back Support",s:"Full Body Integration",st:"ישיבה שלמה בגב זקוף, רגליים ישרות וצמודות, פלקס, כפות ידיים על המזרן מאחורי האגן, אצבעות לכיוון האגן.",steps:[["i","במקום."],["e","דוחפים את הרצפה עם הידיים ומרימים את האגן לקו ישר מכפות הרגליים ועד הקודקוד, רגליים לפוינט."],["i","מניחים את האגן בלי לשנות את מנח הידיים או הגב, ומחזירים לפלקס."]],note:"הקלה: ברכיים כפופות וכפות רגליים על המזרן; עם כאב בצוואר אפשר להפנות מבט לפנים.",m:"Triceps + Hamstrings"},
{n:"Leg Pull Back",s:"Full Body Integration",st:"מתחילים ממנח Back Support.",steps:[["e","מרימים רגל אחת בפלקס כמה שאפשר בלי לשנות את גובה האגן."],["i","מורידים את הרגל בפוינט עד מגע במזרן."]],note:"פעם ימין ופעם שמאל.",m:"Triceps + Hamstrings + Hip Flexors"},
{n:"Saw",s:"Side Flexion and Rotation",st:"ישיבה בגב זקוף, רגליים ישרות ברוחב המזרן, פלקס, ידיים ישרות לצדדים, כפות פונות מטה.",steps:[["i","מעבירים יד אחת ישרה לפנים מעל הרגל הנגדית (אגודל מעלה) ויד שנייה ישרה לאחור (אגודל מטה)."],["e","הטיה של הגב לכיוון הרגל, הגב מתעגל, המצח לכיוון הרגל, כאילו חותכים עם היד את הרגל."],["i","הגב מתארך חזרה לפנים וחוזר ישר מעל האגן."],["e","הידיים חוזרות לצדדים, גב זקוף."]],note:"ממשיכים פעם לימין ופעם לשמאל.",m:"Abdominals Obliques + Spine Extensors"},
{n:"Spine Twist",s:"Side Flexion and Rotation",st:"ישיבה בגב זקוף, רגליים ישרות לפנים ומקבילות ברוחב האגן, פלקס, ידיים ישרות לצדדים, כפות לתקרה.",steps:[["e","(2 נשיפות קצרות) אוספים בטן ומבצעים רוטציה לצד אחד בשתי ניעות, הראש נשאר במרכז בין הידיים."],["i","(שאיפה קצרה) חוזרים למרכז."],["e","(2 נשיפות) אותו פיתול לצד השני."]],note:"אפשר גם עם כפות ידיים על הכתפיים או מקל על השכמות.",m:"Abdominals Obliques + Spine Extensors"},
{n:"Side Bend",s:"Side Flexion and Rotation",st:"שכיבה על הצד על האמה, כף היד פונה קדימה, יד עליונה על האגן, רגליים כפופות, רגל עליונה קדמית, עקב עליון צמוד לכף הרגל התחתונה. מרפק, אגן ועקב בקו אחד.",steps:[["i","הרגליים דוחפות את המזרן ומתיישרות, יד עליונה עולה בהמשך לתחתונה, מנח גוף ישר."],["e","אגן עולה ויד עליונה עוברת מעבר לראש: כפיפה צידית של המותן."],["i","חוזרים לקו ישר על הצד, יד עליונה למעלה."],["e","מכופפים ברכיים והאגן יורד למנח ההתחלתי."]],m:"Abdominals Obliques"},
{n:"Twist Bend",s:"Side Flexion and Rotation",st:"ישיבה על הצד, ברכיים כפופות, עקב עליון צמוד לכף הרגל התחתונה, כף יד על המזרן פונה הצידה, יד ישרה.",steps:[["i","רגליים דוחפות ומתיישרות, האגן מתנתק, קו אחד מהרגליים ועד הקודקוד, יד עליונה בהמשך ליד התחתונה."],["e","אגן עולה, בית החזה והראש יורדים, היד התחתונה נכנסת מתחת לגוף: פיתול של עמוד השדרה."],["i","חזרה למנח הקודם, יד ישרה למעלה."],["e","יורדים בחזרה להתחלה."]],note:"ברצף לא מניחים את האגן עד הסוף בירידה.",m:"Abdominals Obliques + Hip Flexors"},
{n:"Spine Stretch Forward",s:"Back Extension",st:"ישיבה, רגליים ישרות לפנים ברוחב המזרן, גב זקוף, ידיים ישרות לפנים בגובה הכתפיים.",steps:[["i","במקום."],["e","מגלגלים את חוליות הצוואר ובית החזה מטה עד T8 ומניעים את הגב קדימה."],["i","מאריכים את הגב בקו אלכסוני קדימה ומרימים ידיים ישרות לצידי האוזניים."],["e","מעגלים את הגב בחזרה, חוזרים לעצמות הישיבה ומגלגלים חוליה אחר חוליה לישיבת המוצא."]],m:"Spine Extensors"},
{n:"Basic Back Extension",s:"Back Extension",st:"שכיבה על הבטן, ידיים על האמות מקבילות, כפות על המזרן, צוואר בהמשך לגב.",steps:[["e","אוספים את הבטן פנימה ומנתקים אותה מהמזרן, ללא תנועה של הגב."],["i","משחררים את איסוף הבטן."]],note:"תרגיל בסיסי שמלמד שימוש בשרירי הבטן כתמיכה בתרגילי גב.",m:"Spine Extensors"},
{n:"Single Leg Kick",s:"Back Extension",st:"מתחילים ממנח Basic Back Extension.",steps:[["e","(2 נשיפות קצרות) אוספים בטן, מכופפים רגל אחת בפלקס ומבצעים שתי בעיטות עם העקב לכיוון הישבן."],["i","מיישרים את הרגל לאחור בפוינט, מעט מעל המזרן."],["e","בעיטות לישבן ברגל השנייה."]],note:"פעם ימין ופעם שמאל, מספר פעמים.",m:"Spine Extensors + Hamstrings"},
{n:"Double Leg Kick",s:"Back Extension",st:"שכיבה על הבטן, ראש מונח על צד אחד, כפות ידיים שלובות על הגב התחתון, ברכיים כפופות.",steps:[["e","(3 נשיפות קצרות) בועטים 3 פעמים עם הרגליים לכיוון הישבן, פלקס."],["i","רגליים וידיים נמתחות לאחור, פוינט, בית החזה עולה לפשיטה, צוואר בהמשך לגב, ראש במרכז."]],note:"הראש מונח על המזרן כל פעם על צד אחר.",m:"Spine Extensors + Hamstrings"},
{n:"Swimming",s:"Back Extension",st:"שכיבה על הבטן, בית החזה מעל המזרן בפשיטה, ידיים ישרות לפנים ורגליים ישרות לאחור.",steps:[["n","5 נשימות כלב בשאיפה ו-5 בנשיפה: יד ימין ורגל שמאל עולות, יד שמאל ורגל ימין יורדות, והחלפות בקצב הנשימה."]],m:"Spine Extensors"},
{n:"Swan Dive",s:"Back Extension",st:"שכיבה על הבטן, מרפקים כפופים, אמות מונחות על המזרן מקבילות.",steps:[["e","בטן נאספת, דוחפים את הרצפה ומאריכים מרפקים."],["i","במקום."],["e","מאריכים ידיים קדימה מעבר לראש תוך נדנוד הגוף קדימה, רגליים עולות."],["i","נדנוד אחורה, רגליים יורדות ובית החזה עולה לפשיטה מקסימלית."]],m:"Spine Extensors"},
{n:"Rocking",s:"Back Extension",st:"שכיבה על הבטן, ברכיים כפופות, כפות רגליים לכיוון הישבן, ידיים אוחזות בקרסוליים, לחי מונחת על המזרן.",steps:[["h","הכנה"],["e","הרגליים דוחפות את הידיים, הבטן נאספת ועולים למנח נדנדה."],["i","יורדים בחזרה ומניחים את הלחי השנייה."],["h","התרגיל המלא"],["i","ממנח נדנדה מתנדנדים לאחור."],["e","מתנדנדים לפנים."]],m:"Spine Extensors"},
{n:"Rest Position",s:"Stretches",st:"נקראת גם תנוחת עובר: יושבים עם הישבן לכיוון כפות הרגליים, ברכיים כפופות, ראש משוחרר, ידיים ישרות לפנים או מונחות על המזרן.",steps:[],note:"אפשר לפתוח את הברכיים לשחרור מפרקי הירך.",m:"Spine Extensors",stretch:true}
];

{n:"Pelvic Curl",s:"Spinal Articulation",sp:"1-1",st:"שכיבה על המזרן צמוד אל הכיסא, ברכיים כפופות, עקבים על הבר דורכים אותו עד הרצפה, ידיים לצידי הגוף, כפות ידיים לתקרה.",steps:[["e","מגלגלים את האגן ל-PPT ומנתקים חוליות אחת אחרי השנייה עד קו ישר מהכתפיים ועד הברכיים."],["i","במקום, מאריכים עוד את הגב, ברכיים מקבילות."],["e","מניחים את החוליות בחזרה עד גב נטרלי, הבר נשאר למטה ללא תנועה."]],m:"Hamstrings"},

{n:"Jack Knife",s:"Spinal Articulation",sp:"1-1",st:"שכיבה על המזרן עם הראש צמוד אל הכיסא, ידיים אוחזות בבר משני צידיו, רגליים ישרות בפוינט ב-60 מעלות.",steps:[["i","רגליים עולות ל-90 מעלות."],["e","רגליים עוברות מעבר לראש, מנתקים חוליה אחר חוליה ומניחים את הרגליים על מושב הכיסא."],["i","מרימים רגליים לתקרה בפוינט למנח נר."],["e","מניחים חוליה אחר חוליה, רגליים ישרות לתקרה עד אגן נטרלי; מעגל קטן וסוגרים ל-60 מעלות."]],m:"Abdominals"},
{n:"Shrugs",s:"Arm Work",sp:"1-1",st:"ישיבה על קופסה קטנה עם הגב אל הבר, כפות ידיים על הבר משני צידיו פונות החוצה; דוחפים את הבר מטה עד ידיים ישרות, גב ישר.",steps:[["i","כתפיים עולות לכיוון האוזניים."],["e","דוחפים את הבר בחזרה למטה תוך ירידת הכתפיים והתרווחות השכמות."]],m:"Serratus Anterior"},
{n:"Triceps Press Sit",s:"Arm Work",sp:"1-1",st:"ישיבה על קופסה קטנה עם הגב אל הכיסא, כפות ידיים על הבר משני צידיו, מרפקים כפופים ומקבילים, גב ישר.",steps:[["e","מיישרים את המרפקים מטה, שכמות רחבות, שומרים על אורך בגב."],["i","מכופפים מרפקים מקבילים בחזרה."]],m:"Triceps"},
{n:"Chest Expansion",s:"Arm Chair Series",sp:"קפיצים בצדי הכיסא",st:"ישיבה על קופסה מול הכיסא, רגליים על הרצפה מקבילות, גב זקוף, פנים אל הכיסא, ידיים ברצועות ישרות לצידי הגוף מעט קדימה, כפות ידיים לאחור.",steps:[["e","מאריכים את עמוד השדרה, פותחים את בית החזה ומניעים ידיים לאחור; הקפיץ נמתח."],["i","הקפיץ נסגר, ידיים חוזרות לנקודת המוצא."]],m:"Latissimus Dorsi"},
{n:"Biceps",s:"Arm Chair Series",sp:"קפיצים בצדי הכיסא",st:"ישיבה על קופסה, פנים אל הכיסא, רגליים כפופות, כפות רגליים כנגד הכיסא, ידיים ברצועות ישרות לפנים בגובה החזה, כפות לתקרה.",steps:[["e","מכופפים מרפקים בלי לשנות את גובה המרפק, הקפיץ נמתח."],["i","מיישרים ידיים בחזרה."]],m:"Biceps"},
{n:"Rhomboid",s:"Arm Chair Series",sp:"קפיצים בצדי הכיסא",st:"אותה ישיבה, ידיים אוחזות ברצועות ישרות לפנים, כפות ידיים מטה.",steps:[["e","מכופפים מרפקים לצדדים, הקפיץ נמתח."],["i","מיישרים ידיים בחזרה."]],m:"Rhomboids"},
{n:"Hug-A-Tree",s:"Arm Chair Series",sp:"קפיצים בצדי הכיסא",st:"ישיבה עם הגב צמוד אל הכיסא, רגליים על הרצפה מקבילות, ידיים ברצועות ארוכות לצדדים בזווית העיניים, כפות ידיים בגובה בית החזה.",steps:[["e","תנועת חיבוק עם הידיים, הקפיצים נמתחים."],["i","פותחים ידיים בחזרה."]],m:"Pectoralis"},
{n:"Down Circles",s:"Arm Chair Series",sp:"קפיצים בצדי הכיסא",st:"מתחילים מאותו מנח של Hug-A-Tree.",steps:[["i","מרימים ידיים מהצדדים למעלה, שומרים מתח בקפיץ."],["e","מורידים ידיים עד גובה החזה, הקפיצים נמתחים."],["i","פותחים ידיים לצדדים בגובה החזה, בטווח הראייה, ומרימים בחזרה בצורה מעגלית."]],m:"Pectoralis + Deltoid"},
{n:"Up Circles",s:"Arm Chair Series",sp:"קפיצים בצדי הכיסא",st:"מתחילים מאותו מנח של Hug-A-Tree.",steps:[["e","סוגרים ידיים לפנים עד שהן מקבילות, הקפיץ נמתח."],["i","מפנים כפות ידיים מטה ומאפשרים לידיים לעלות ולהיפתח בצורה מעגלית."]],m:"Pectoralis + Deltoid"},
{n:"Salute",s:"Arm Chair Series",sp:"קפיצים בצדי הכיסא",st:"ישיבה עם הגב צמוד אל הכיסא, מרפקים כפופים ומקבילים מעט מעל גובה הכתפיים, אגודלים צמודים לרקות.",steps:[["e","מיישרים ידיים, שומרים על גובה המרפקים, הקפיץ נמתח."],["i","מכופפים מרפקים בחזרה אל הרקות."]],m:"Triceps"},
{n:"Hamstring Curl",s:"Leg Work",sp:"1-1",st:"שכיבה על המזרן צמוד אל הכיסא, רגליים ישרות, עקבים על הבר, ידיים לצידי הגוף.",steps:[["e","מורידים את הבר תוך כפיפת הברכיים, שומרים על אגן נטרלי."],["i","מאפשרים לבר לעלות ולברכיים להתיישר."]],m:"Hamstrings"},
{n:"Frog",s:"Leg Work",sp:"1-1",st:"שכיבה על המזרן, עקבים על הבר צמודים, ברכיים פתוחות עד הסוף החוצה, אצבעות מופרדות, ידיים לצידי הגוף.",steps:[["e","דורכים את הבר עד חצי הדרך למטה, עקבים לכיוון הישבן."],["i","נותנים לבר לעלות בחזרה."]],note:"מומלץ להישאר כמה נשימות בחצי הדרך ולהעמיק את העבודה.",m:"Hip Adductors"},
{n:"Leg Press Standing",s:"Lunge Series",sp:"1-1",st:"עמידה עם הפנים אל הכיסא, ידיים לצידי הגוף, גב זקוף, רגל אחת עם כריות האצבעות על הבר.",steps:[["e","דוחפים את הבר עם הרגל תוך איסוף בטן ושמירה על שיווי משקל."],["i","מאפשרים לבר לעלות בחזרה."]],m:"Quadriceps + Gluteus Medius"},
{n:"Forward Lunge",s:"Lunge Series",sp:"3-3",st:"רגל אחת עומדת עם האצבעות על הבר, רגל שנייה מונחת בחלק הקדמי של המושב, ידיים לצידי הגוף (אפשר להיתמך בידיות).",steps:[["e","דוחפים עם הרגל הקדמית את המושב ועולים עם כל הגוף במנח אחיד מעלה, כמה שאפשר."],["i","יורדים בחזרה תוך שמירה על מנח הגוף."]],m:"Quadriceps + Gluteus Medius"},
{n:"Backward Step Down",s:"Lunge Series",sp:"3-3",st:"מבצעים Forward Lunge ועוצרים באמצע הדרך כשהרגל הקדמית כפופה ב-90 מעלות; יד על יד, מרפקים כפופים בגובה הכתפיים.",steps:[["i","מכופפים את הרגל האחורית בלי לשנות את מנח הגוף."],["e","מיישרים את הרגל בחזרה."]],m:"Quadriceps + Gluteus Medius"},
{n:"Tendon Stretch",s:"Full Body Integration",sp:"3-3",st:"עמידה על הבר על האצבעות, עקבים גבוהים, ישבן לכיוון הכיסא, גב עגול, כפוף לפנים, ידיים ישרות על הקצה הקדמי של המושב.",steps:[["e","אוספים בטן, ותוך קימור מקסימלי של הגב מאפשרים לבר לעלות כמה שניתן."],["i","יורדים בחזרה תוך שמירה על הקימור."]],m:"Rectus Abdominus"},
{n:"Frog Front",s:"Full Body Integration",sp:"3-3",st:"עמידה עם האצבעות על הבר ב-V, ברכיים כפופות פונות החוצה, פנים אל הכיסא, ידיים ישרות על המושב משני צידיו, כתפיים מעל כפות הידיים, אצבעות פונות החוצה.",steps:[["i","ברכיים מתכופפות, עקבים מתקרבים אל הישבן, שאר הגוף נשאר במנח ההתחלתי."],["e","רגליים דוחפות את הבר עד למטה."]],m:"Hip Adductors"},
{n:"Frog Back",s:"Full Body Integration",sp:"3-3",st:"ישיבה על הכיסא, כריות האצבעות על הבר ב-V, ברכיים כפופות לצפרדע, הגב אל הכיסא, כפות ידיים על קצה המושב פונות קדימה, מרפקים ישרים ומקבילים. מנתקים את האגן מהכיסא, גב זקוף, ידיים ישרות וחזקות, עקבים קרובים לישבן ככל הניתן.",steps:[["i","מכופפים מרפקים מקבילים, הבר יורד איתנו אבל לא מגיע לרצפה."],["e","מיישרים מרפקים, הבר עולה איתנו, שאר הגוף לא משנה את המנח."]],m:"Triceps"},
{n:"Mermaid",s:"Side Flexion and Rotation",sp:"1-1",st:"ישיבה על הכיסא בפרופיל, רגל אחת על המושב ב-90 מעלות מהגוף (אם קשה, להוריד רגל לפנים ולעטוף עם העקב את דופן הכיסא), רגל שנייה על הרצפה ישרה, כף הרגל קדימה, ידיים לצידי הגוף.",steps:[["i","כפיפה צידית לכיוון הבר, מניחים את היד הקרובה על הבר תוך הרמת היד השנייה ישרה מעבר לראש; העקב שעל הרצפה מתנתק מעט."],["e","מניחים את העקב ומעמיקים את המתיחה."]],m:"Abdominal Obliques",stretch:true},
{n:"Kneeling Mermaid",s:"Side Flexion and Rotation",sp:"1*2",st:"עמידה על הברכיים ליד הכיסא בפרופיל, יד אחת על הבר, כף היד לפנים, יד שנייה ישרה לצד הגוף.",steps:[["e","כפיפה צידית תוך שמירה על האגן במרכז; היד שעל הבר נשארת ישרה, היד השנייה עולה ישרה מעבר לראש למתיחה."],["i","חוזרים למרכז, היד הרחוקה יורדת לצד הגוף."]],note:"אפשר להישאר במתיחה הצידית ורק לכופף וליישר את המרפק התחתון, לעבודה על ה-Triceps.",m:"Abdominal Obliques + Triceps"}];

{n:"Gluteals Stretch",s:"Stretches",sp:"",st:"אותו מנח; מכופפים את הברך של הרגל שבחישוק, הברך נפתחת החוצה וכף הרגל מסתובבת פנימה.",steps:[["e","מקרבים את הרגל לכיוון הראש; אם אפשר, מכופפים את הראש ומניחים אותו על הדופן התחתונה של המג׳יק. נשארים כמה נשימות להעמקה."],["i","משחררים בחזרה למנח ההתחלתי."]],m:"Gluteals Stretch"}];
const LADDER=[{n:"Side Over",s:"Lateral Flexion",sp:"",st:"עמידה בפרופיל, רגליים על המסגרת שעל הרצפה: הרגל הקרובה לקשת קדימה, הרגל הקרובה לסולם אחורה; צד הגוף מונח על קשת החבית בכפיפה צידית, ידיים שלובות מאחורי הראש.",steps:[["e","עולים עם החזה עד קו ישר מכפות הרגליים ועד קודקוד הראש."],["i","מיישרים ידיים מעבר לראש בהמשך לקו הגוף."],["e","משלבים ידיים בחזרה מאחורי הראש ויורדים אל הכפיפה הצידית."],["i","במקום, למטה."]],m:"Abdominal Obliques"},

{n:"Swan",s:"Back Extension",sp:"",st:"עמידה עם העקבים על השלב הראשון של הסולם, כפות רגליים ב-V קטן, ברכיים מעט כפופות, ידיים שלובות מאחורי הראש, מרפקים בזווית העיניים, החזה מונח על קשת החבית.",steps:[["e","בית החזה עולה עד קו ישר עם הגוף ומעט יותר; מיישרים ברכיים, הידיים מתארכות לצידי הראש."],["i","מחזירים את הידיים אל מאחורי הראש ויורדים למנח ההתחלתי."]],m:"Spine Extensors"},
{n:"Swan Advanced",s:"Back Extension",sp:"",st:"אותו מנח של Swan; אפשר לעמוד בגובה שמתאים לגמישות הגב.",steps:[["e","מרימים את בית החזה עד פשיטה מקסימלית, ברכיים מתכופפות, הידיים מתארכות למעלה בהמשך לקו הגוף."],["i","מיישרים רגליים, הגב והידיים נעים קדימה עד קו ישר מכפות הרגליים ועד קודקוד הראש."],["e","עולים בחזרה לפשיטה מקסימלית."]],m:"Spine Extensors"},

{n:"Gluteals",s:"Stretches",sp:"",st:"עמידה בתוך החבית בפרופיל; מרימים את הרגל הקרובה אל קשת החבית ומניחים עליה, כף הרגל במרכז, ברך כפופה פונה החוצה; רגל העמידה צמודה למסגרת האחורית, ידיים אוחזות בידיות מאחור.",steps:[["i","מאריכים את הגב לכיוון הרגל שעל החבית, הראש משתחרר מטה, מכופפים את ברך העמידה."],["e","מיישרים את רגל העמידה תוך העמקת המתיחה, ועולים חוליה אחר חוליה או מאריכים את הגב ועולים למנח ההתחלתי."]],m:"Gluteals Stretch"},
{n:"Hamstrings",s:"Stretches",sp:"",st:"כמו Gluteals, רק שהרגל שעל החבית ישרה בפלקס.",steps:[],note:"מבצעים בדיוק את אותו תרגיל כמו Gluteals, עם רגל ישרה בפלקס על החבית.",m:"Hamstring Stretch"},
{n:"Adductors",s:"Stretches",sp:"",st:"עמידה בתוך החבית בפרופיל, רגל העמידה צמודה לפינה של המסגרת; הרגל הקרובה לקשת מונחת עליה, מעט קדימה מקו הגוף, פלקס; היד הקרובה לקשת אוחזת בבר מלמטה, היד השנייה ישרה הצידה.",steps:[["i","כפיפה צידית של הגוף לכיוון הרגל שעל החבית; היד הרחוקה עולה ארוכה מעבר לראש, מכופפים את ברך העמידה ומעמיקים את המתיחה, שני צידי האגן שווים."],["e","מיישרים את הרגל ועולים בחזרה למנח ההתחלתי."]],m:"Hip Adductors Stretch"},

const STEP=[{n:"Chest Lift",s:"Abdominal Work",sp:"",st:"ישיבה עם הגב צמוד אל הקשת, ברכיים כפופות וצמודות, בית החזה בפשיטה לאחור, ידיים שלובות מאחורי הראש, מרפקים בזווית הראייה.",steps:[["e","עולים עם בית החזה לכפיפה תוך איסוף הבטן פנימה, עד שהשכמות מתנתקות מהקשת."],["i","מעמיקים את איסוף הבטן עוד קצת."],["e","יורדים בחזרה למנח ההתחלתי."]],m:"Rectus Abdominus"},
{n:"The Reach",s:"Abdominal Work",sp:"",st:"ישיבה צמוד אל הקשת, גב עגול, כתפיים מעל עצמות הישיבה, ברכיים כפופות, כפות רגליים על הרצפה מקבילות ברוחב האגן, ידיים ישרות לפנים פונות זו אל זו.",steps:[["e","מניחים חוליה אחר חוליה על הקשת; כשמגיעים לעצם בית החזה מתחילים ליישר רגליים תוך הארכת עמוד השדרה לאחור והנעת הזרועות לאחור. האגן עולה, החזה הולך לפשיטה, ידיים מעבר לראש."],["i","מעגל עם הזרועות עד חזרה לפנים, מניחים את האגן ומרימים את בית החזה, הראש והידיים לפנים."],["e","עולים חוליה אחר חוליה תוך כפיפת הברכיים, חזרה למנח ההתחלתי."]],m:"Rectus Abdominus"},
{n:"Teaser",s:"Abdominal Work",sp:"",st:"יושבים עם הגב צמוד אל הקשת, רגליים ישרות לפנים וצמודות בפוינט, הגב מונח על הקשת, ידיים מעבר לראש, ראש בהמשך לגב.",steps:[["e","עולים עם החזה לכפיפה, מניעים ידיים לפנים ומרימים רגליים ישרות לכיוון התקרה בפלקס."],["i","מורידים רגליים בחזרה בפוינט; החזה והראש יורדים והידיים חוזרות לאחור."]],m:"Rectus Abdominus + Hip Flexors"},
{n:"Roll Over",s:"Spinal Articulation",sp:"",st:"שכיבה על הגב, כל החוליות על הקשת מלבד הכתפיים והראש שעל המזרן; האגן ב-APT בחלק הגבוה של הקשת, ידיים אוחזות בצידי הקשת, מרפקים החוצה, רגליים ישרות וצמודות ב-60 מעלות, פוינט.",steps:[["i","רגליים עולות ל-90 מעלות."],["e","מנתקים מהקשת חוליה אחר חוליה ומעבירים רגליים ישרות מעבר לראש."],["i","רגליים נפתחות לרוחב הכתפיים, הופכות לפלקס ונוגעות במזרן מאחורי הראש."],["e","מניחים חוליה אחר חוליה על הקשת, רגליים נמוכות ככל האפשר, ובסוף חוזרות ל-60 מעלות, פוינט וצמודות."]],note:"פעם כך ופעם הפוך: לאחור בפוינט ברוחב כתפיים, לפנים בפלקס וצמודות.",m:"Rectus Abdominus"},
{n:"Spine Twist Supine",s:"Spinal Articulation",sp:"",st:"אותו מנח על הקשת (APT בחלק הגבוה), ידיים בצידי הקשת או על הצלעות, מרפקים החוצה, ברכיים כפופות ב-90 מעלות.",steps:[["i","מניעים רגליים לצד אחד תוך הארכת הצד הנגדי של הגוף; החזה והראש במרכז."],["e","מחזירים רגליים למרכז מתוך איסוף הבטן."]],note:"אפשר לאתגר ולבצע עם רגליים ישרות.",m:"Abdominal Obliques"},
{n:"Corkscrew",s:"Spinal Articulation",sp:"",st:"אותו מנח על הקשת, רגליים ישרות לכיוון התקרה.",steps:[["i","מטים רגליים לצד אחד תוך הארכת הצד הנגדי, כפות רגליים בפלקס."],["e","מניעים רגליים קדימה ובמעגל בפוינט עד המנח ההתחלתי, וחוזרים לפלקס."]],note:"פעם לצד אחד ופעם לצד השני.",m:"Abdominal Obliques"},
{n:"Corkscrew Advanced",s:"Spinal Articulation",sp:"",st:"אותו מנח על הקשת, רגליים ישרות ב-60 מעלות קדימה.",steps:[["e","מטים רגליים לצד אחד ומשם אחורה מעבר לראש למנח Roll Over, פלקס."],["i","דרך הצד השני מניחים חוליות על הקשת ומורידים רגליים במעגל עד 60 מעלות."]],note:"חצי מעגל בנשיפה וחצי מעגל בשאיפה, כפות רגליים בפוינט.",m:"Abdominal Obliques"},

{n:"Helicopter",s:"Leg Work – Leg Weights",sp:"",st:"אותו מנח עם משקולות, רגליים ישרות לתקרה.",steps:[["i","רגל אחת לפנים בפוינט ורגל אחת לאחור בפלקס, למנח Scissors."],["e","תנועה מעגלית עם שתי הרגליים עד שהן מחליפות מקום, ומשם סוגרים בחזרה לתקרה בפוינט."]],note:"פעם לצד אחד ופעם לצד השני.",m:"Quadriceps + Hamstrings + Hip Adductors"},
{n:"Bicycle",s:"Leg Work – Leg Weights",sp:"",st:"אותו מנח עם משקולות, רגליים ישרות לתקרה.",steps:[["i","רגל אחת לפנים בפוינט ורגל אחת לאחור בפלקס, למנח Scissors."],["e","מכופפים את הרגל הרחוקה מהראש ומחליפים בין הרגליים: כשהרחוקה מתכופפת, הקרובה מתיישרת."]],note:"Reverse: אותו דבר, אבל מכופפים את הרגל הקרובה לראש. בכל שלב רגל אחת כפופה ואחת ישרה.",m:"Quadriceps + Hamstrings + Hip Adductors"},
{n:"Side Lift",s:"Lateral Flexion",sp:"",st:"שוכבים על הצד, מפרק הירך בתחתית הקשת, רגל תחתונה כפופה 90 מעלות מהגוף, רגל עליונה ישרה בהמשך לקו הגוף, יד תחתונה כפופה מתחת לראש, יד עליונה ישרה על הגוף.",steps:[["e","החזה עולה לכפיפה צידית, היד התחתונה עולה אל מעבר לראש."],["i","היד יורדת בחזרה אל הגוף והחזה יורד אל הקשת."]],m:"Abdominal Obliques"},

{n:"Shoulder Stretch Side",s:"Stretches",sp:"",st:"שוכבים על הצד, מפרק הירך בתחתית הקשת, רגל תחתונה כפופה 90 מעלות, רגל עליונה ישרה, יד תחתונה ישרה מתחת לראש, יד עליונה ישרה על הגוף.",steps:[["e","מניעים את היד העליונה לפנים ולמעלה מעבר לראש; בית החזה נפתח לפיתול והיד ארוכה לאחור."],["i","ממשיכים דרך למטה במעגל ולוקחים את היד העליונה רחוק לפנים."]],m:"Pectoralis Stretch"}];
const TOW=[{n:"Double Leg Foot Work",s:"Foot Work",sp:"אדום, כחול (Bottom Loaded)",st:"שכיבה על הגב, אגן וגב נטרליים, רגליים כנגד ה-PTB, הראש על כרית הראש מעבר למזרן הקדילק, כפות הרגליים מעל האגן, ידיים לצידי הגוף.",steps:[["e","דוחפים עם הרגליים את הבר עד יישור מלא של הברכיים, תוך שמירה על גב ואגן נטרליים."],["i","מכופפים בחזרה את הברכיים ועוצרים רגע לפני סגירת הקפיץ."]],note:"מנחים: Parallel Heels (עקבים על הבר, מקבילות, פלקס) · Parallel Toes (כריות הבהונות, פוינט) · V-Position (כריות הבהונות, עקבים יחד) · Open V-Position Heels (עקבים, פיסוק ברוחב הבר) · Open V-Position Toes (כריות הבהונות, פיסוק ברוחב הבר).",m:"Quadriceps + Hamstrings"},

{n:"Prances",s:"Foot Work",sp:"אדום, כחול (Bottom Loaded)",st:"כריות הבהונות על ה-PTB, מקבילות ברוחב האגן, רגליים ישרות.",steps:[["e","דוחפים את הבר לפוינט."],["i","רגל אחת שוקעת לפלקס והשנייה מתכופפת."],["e","עולים על האצבעות, שתי הרגליים מתיישרות, ומחליפים רגליים."]],note:"ממשיכים: החלפה בשאיפה והחלפה בנשיפה.",m:"Gastrocnemius + Soleus"},
{n:"Single Leg Foot Work",s:"Foot Work",sp:"אדום (Bottom Loaded)",st:"רגל אחת על ה-PTB, השנייה מונחת כפופה על המזרן, ידיים ישרות לצידי הגוף.",steps:[["e","אוספים בטן ודוחפים את הבר עד יישור מלא של הרגל."],["i","מכופפים את הברך ועוצרים רגע לפני סגירת הקפיץ."]],note:"שתי פוזיציות: Single Leg Heel (עקב על הבר, פלקס) · Single Leg Toes (כריות הבהונות, פוינט).",m:"Quadriceps + Hamstrings"},
{n:"Hip Opener",s:"Foot Work",sp:"אדום/כחול (Bottom Loaded)",st:"שכיבה על הצד, הראש על היד התחתונה בקו כרית הראש מעבר למזרן הקדילק, אגן מקביל וכתף מעל כתף, רגל תחתונה ישרה על המזרן, כריות הבהונות של הרגל העליונה על ה-PTB ב-turn out.",steps:[["i","הברך העליונה מתכופפת; עוצרים רגע לפני סגירת הקפיץ."],["e","דוחפים את הבר ומיישרים את הרגל תוך העמקת ה-turn out."]],m:"ITB + Gluteus"},
{n:"Roll Up With Roll Up Bar",s:"Abdominal Work",sp:"צהובים, שליש אמצעי + RUB",st:"ישיבה עם הפנים אל הקדילק, אוחזים בבר, ידיים ישרות לפנים, גב עגול, רגליים ברוחב האגן.",steps:[["e","מניחים על המזרן חוליה אחר חוליה עד שכיבה מלאה."],["i","מרימים את הראש ומסתכלים קדימה."],["e","מנתקים את החוליות מהמזרן אחת אחרי השנייה עד ישיבה."]],m:"Rectus Abdominus + Hip Flexors"},
{n:"Mini-Roll Ups",s:"Abdominal Work",sp:"PTB אדום, כחול (Top Loaded)",st:"שכיבה על הגב עם הראש עד סוף המזרן, ידיים אוחזות בבר ישרות למעלה, ברכיים כפופות וצמודות.",steps:[["i","נותנים לבית החזה לעלות ולגב התחתון להתנתק מעט מהמזרן, שומרים על גב עגול."],["e","אוספים בטן ומעמיקים את הקימור; הגב התחתון נוגע במזרן."],["i","נותנים לחזה לעלות פעם נוספת."]],note:"תנועה קטנה של העמקה ואיסוף הבטן.",m:"Rectus Abdominus"},
{n:"Mini-Roll Ups Oblique",s:"Abdominal Work",sp:"PTB אדום, כחול (Top Loaded)",st:"שכיבה על הגב עם הראש עד סוף המזרן, יד אחת אוחזת בבר באחיזה הפוכה (אצבעות פנימה), יד שנייה מאחורי הראש, ברכיים כפופות על המזרן.",steps:[["i","נותנים לחזה לעלות ולגב התחתון להתנתק מעט, מסובבים את החזה לצד של היד הכפופה; אגן במרכז וגב עגול."],["e","אוספים בטן ומעמיקים את הקימור עד שהגב התחתון נוגע במזרן."],["i","נותנים לחזה לעלות פעם נוספת."]],m:"Abdominal Obliques"},
{n:"Roll Up Top Loaded",s:"Abdominal Work",sp:"PTB כחול (Top Loaded)",st:"שכיבה על הגב עם הראש עד סוף המזרן, ידיים אוחזות בבר ישרות למעלה, רגליים ישרות וצמודות.",steps:[["e","אוספים בטן ועולים עם החזה והראש לקימור."],["i","מאריכים את הגב, ידיים למעלה עד קו ישר מכפות הידיים לעצמות הישיבה."],["e","מקמרים את הגב בחזרה ומניחים חוליה אחר חוליה על המזרן."]],note:"אפשר לבצע גם בלי קפיץ בכלל.",m:"Rectus Abdominus + Spine Extensors"},
{n:"Roll Up Bottom Loaded",s:"Abdominal Work",sp:"PTB כחול (Bottom Loaded)",st:"כמו Roll Up Top Loaded.",steps:[],note:"מתבצע בדיוק כמו Roll Up Top Loaded, רק הקפיץ שונה, ולכן עבודת השרירים משתנה.",m:"Rectus Abdominus + Spine Extensors"},
{n:"Teaser 1+2+3",s:"Abdominal Work",sp:"PTB כחול (Top Loaded)",st:"שכיבה על הגב, ראש מתחת לבר, ידיים אוחזות בבר ישרות, רגליים ישרות מונחות על המזרן.",steps:[["i","דוחפים את הבר למעלה ועולים עם החזה והראש חוליה אחר חוליה עד התארכות מלאה של הגב; מרימים רגליים לגובה העיניים למנח Teaser."],["e","1: מורידים חזה וראש אל המזרן, רגליים נשארות ב-60 מעלות."],["i","עולים בחזרה ל-Teaser."],["e","2: מורידים רגליים ישרות אל המזרן בלי שינוי של הגב."],["i","מרימים רגליים חזרה ל-60 מעלות."],["e","3: מורידים חזה, ראש ורגליים אל המזרן."],["i","עולים בחזרה ל-Teaser."]],m:"Rectus Abdominus + Spine Extensors + Hip Flexors"},
{n:"Frog",s:"Hip Work – Double Leg Supine",sp:"סגולים, מקבילים למזרן",st:"שכיבה על הגב, גב נטרלי, רגליים ברצועות, ידיים ישרות מעבר לראש, כפות ידיים כנגד העמודים מהצד החיצוני, turn out. רגליים כפופות לצפרדע: פלקס ו-V בגובה הברכיים, ברכיים מעל מפרק הירך.",steps:[["e","מיישרים רגליים קדימה עד יישור מלא, מעמיקים את פתיחת מפרקי הירך ומחברים ירכיים."],["i","מכופפים ברכיים בחזרה לצפרדע."]],note:"גובה כפות הרגליים נשמר לאורך כל התרגיל.",m:"Hamstrings + Hip Adductors"},

{n:"Semicircle with RUB",s:"Spinal Articulation",sp:"צהובים, שליש עליון + RUB",st:"שכיבה על הגב, ראש בצד של הבר, ידיים ישרות לאחור על מסגרת המיטה, מכניסים את הבר אל מתחת לברכיים.",steps:[["i","מנתקים את כפות הרגליים מהבר עד שהירך יוצרת קו ישר עם הקפיצים."],["e","מנתקים את החוליות מהמזרן אחת אחרי השנייה עד מנח נר, ברכיים כפופות."],["i","מורידים כפות רגליים בחזרה אל המזרן, האגן נשאר גבוה."],["e","מניחים חוליה אחר חוליה עד מנח נטרלי."],["h","Reverse"],["i","גלגול אגן."],["e","ניתוק רגליים עד נר."],["i","הנחת חוליה אחר חוליה עד נטרלי."],["e","הנחת כפות רגליים על המזרן."]],note:"מומלץ לבצע הכנה של הפרדת תנועת הרגליים ותנועת האגן לפני התרגיל.",m:"Hamstrings + Abdominals"},
{n:"Breathing With PTB",s:"Spinal Articulation",sp:"PTB כחול (Top Loaded)",st:"שכיבה על הגב, ראש מתחת לבר, ידיים אוחזות בבר ישרות, רגליים כפופות על המזרן.",steps:[["i","מכופפים מרפקים ומעבירים את הידיים והבר מעבר לראש עד יישור מלא."],["e","מכופפים מרפקים ומחזירים את הבר, ידיים מתיישרות למעלה."],["i","מגלגלים את האגן ומנתקים חוליה אחר חוליה עד קו ישר מהכתפיים לברכיים."],["e","מניחים חוליה אחר חוליה עד גב נטרלי."],["i","עולים עם החזה והראש ומרימים את הבר עד מנח Teaser."],["e","מניחים חוליה אחר חוליה עד המנח ההתחלתי."]],note:"אפשר גם עם כפות הרגליים בתוך הטרפז.",m:"Hamstrings + Abdominals + Spine Extensors"},
{n:"Kneeling Cat Stretch",s:"Spinal Articulation",sp:"אדום (Top Loaded)",st:"עמידה על הברכיים, גב ישר, פנים אל הבר, כפות ידיים ישרות על הבר.",steps:[["e","מגלגלים את החוליות מטה אחת אחרי השנייה ומניעים את הבר לפנים בידיים ישרות; השכמות רחוקות, האגן נשאר מעל הברכיים."],["i","מיישרים את הגב מקביל לרצפה, הבר מתרחק עוד קצת קדימה מעבר למסגרת המיטה."],["e","מקמרים שוב ועולים חוליה אחר חוליה לעמידה על הברכיים, ובסוף לגב זקוף."]],m:"Abdominals + Spine Extensors"},
{n:"Standing Cat Stretch",s:"Spinal Articulation",sp:"אדום (Top Loaded)",st:"עמידה, פנים אל הבר, כפות ידיים ישרות על הבר.",steps:[],note:"אותו תרגיל בדיוק כמו Kneeling Cat Stretch, רק בעמידה.",m:"Abdominals + Spine Extensors"},
{n:"Shoulder Adduction Double Arm",s:"Arm Work – Push Through Series",sp:"PTB אדום וכחול (Top Loaded)",st:"ישיבה על המיטה עם הפנים אל הבר, גב זקוף, כתפיים מעל עצמות הישיבה, רגל בכל צד, ידיים אוחזות בבר משני צדדיו, ישרות מעלה.",steps:[["e","מכופפים מרפקים מקבילים ומושכים את הבר מטה, שומרים על שכמות רחבות ויציבות הגב."],["i","מאפשרים לידיים להתיישר בחזרה."]],m:"Latissimus Dorsi + Serratus Anterior"},
{n:"Shoulder Adduction Single Arm",s:"Arm Work – Push Through Series",sp:"PTB אדום (Top Loaded)",st:"ישיבה בפרופיל אל הבר, שתי הרגליים מעבר למיטה, היד הקרובה אל הבר אוחזת בו מלמטה ישרה, היד השנייה ישרה לצד השני באותו גובה.",steps:[["e","מכופפים מרפק ומושכים את הבר מטה, שכמות רחבות וגב יציב; היד החופשית מבצעת בדיוק את אותה תנועה."],["i","מאפשרים לידיים להתיישר בחזרה."]],m:"Latissimus Dorsi + Serratus Anterior"},
{n:"Chest Expansion",s:"Arms Standing Series",sp:"צהובים קצרים, מעט מעל גובה הכתפיים",st:"עמידה עם הפנים אל הקפיצים, ידיים ישרות מעט לפני קו הגוף.",steps:[["e","מניעים ידיים ארוכות לאחור עד קו הגוף, גב זקוף ובית חזה פתוח ומשוחרר."],["i","ידיים חוזרות לפנים."]],m:"Latissimus Dorsi"},
{n:"Hug-A-Tree",s:"Arms Standing Series",sp:"צהובים קצרים, מעט מעל גובה הכתפיים",st:"עמידה עם הגב אל הקפיצים, ידיים ארוכות לפנים בגובה בית החזה, נשענים קדימה עד מתח בקפיצים.",steps:[["i","מאפשרים לידיים להיפתח לצדדים, בזווית העיניים."],["e","בתנועת חיבוק גדול סוגרים ידיים לפנים בלי לגעת זו בזו."]],m:"Pectoralis"},
{n:"Down Circles",s:"Arms Standing Series",sp:"צהובים קצרים, מעט מעל גובה הכתפיים",st:"מתחילים מאותו מנח של Hug-A-Tree.",steps:[["i","ידיים נפתחות לצדדים ועולות מעלה."],["e","מורידים ידיים לפנים עד גובה החזה."]],m:"Pectoralis + Deltoid"},
{n:"Up Circles",s:"Arms Standing Series",sp:"צהובים קצרים, מעט מעל גובה הכתפיים",st:"מתחילים מאותו מנח של Hug-A-Tree.",steps:[["i","ידיים עולות למעלה מקבילות ונפתחות לצדדים ולמטה עד גובה החזה, בזווית העיניים."],["e","ידיים נסגרות לפנים ארוכות עד רוחב הכתפיים."]],m:"Pectoralis + Deltoid"},
{n:"Punching",s:"Arms Standing Series",sp:"צהובים קצרים, מעט מעל גובה הכתפיים",st:"מתחילים מאותו מנח של Hug-A-Tree.",steps:[["i","יד מתיישרת קדימה ויד שנייה מתכופפת, מרפק הצידה; מחליפים בין הידיים (שתי החלפות)."],["e","שתי החלפות."]],note:"שתי החלפות בשאיפה ושתי החלפות בנשיפה.",m:"Pectoralis + Deltoid"},
{n:"Biceps",s:"Arms Standing Series",sp:"צהובים קצרים, מעט מעל גובה הכתפיים",st:"עמידה עם הגב אל הקפיצים, ידיים ארוכות לאחור מקבילות, כפות ידיים פונות לפנים, נשענים קדימה עד מתח בקפיצים.",steps:[["i","מכופפים מרפקים מקבילים, המרפקים נשארים לאחור, כפות הידיים מגיעות עד צידי האגן."],["e","מיישרים מרפקים בחזרה לאחור."]],note:"המרפק הוא הציר ולא משנה את מיקומו לאורך כל התרגיל.",m:"Biceps"},
{n:"Butterfly",s:"Arms Standing Series",sp:"צהובים קצרים, מעט מעל גובה הכתפיים",st:"עמידה עם הגב אל הקפיצים, ידיים ארוכות לצדדים בזווית העיניים; שומרים על מתח בקפיצים לאורך כל התרגיל.",steps:[["h","הכנה"],["i","כפיפה צידית עם הגב, הראש נשאר במרכז בין הידיים."],["e","אוספים בטן וחוזרים עם הגוף למרכז."],["h","התרגיל המלא"],["e","מתוך הכפיפה הצידית מסתובבים אל הקפיצים, הידיים מגיעות למטה לאותו גובה ומתח הקפיץ נשמר."],["i","חוזרים למנח ההתחלתי מאותה דרך, עדיין עם מתח בקפיצים."]],note:"מצד לצד לסירוגין.",m:"Pectoralis"},
{n:"Shrugs",s:"Ped-A-Pull Series",sp:"צהובים קצרים, מקבילים לרצפה בתחילת המתיחה",st:"עמידה או ישיבה עם הגב לרצועות, ממקמים את הקפיצים כך שכשהידיים ישרות לפנים בגובה הכתפיים הקפיץ ישר. ידיים ישרות לצידי הגוף למטה, הקפיצים מתוחים.",steps:[["i","כתפיים עולות לכיוון האוזניים."],["e","עמוד השדרה מתארך, הכתפיים יורדות בחזרה ומתרחקות מהאוזניים."]],m:"Serratus Anterior"},
{n:"Triceps",s:"Ped-A-Pull Series",sp:"צהובים קצרים, מקבילים לרצפה בתחילת המתיחה",st:"ידיים צמודות אל הגוף, מרפקים כפופים ב-90 מעלות, כפות ידיים פונות מטה.",steps:[["e","מותחים את הקפיץ ומיישרים מרפקים עד שהידיים ישרות מטה."],["i","מכופפים בחזרה את המרפקים ל-90 מעלות."]],m:"Triceps"},
{n:"Extension",s:"Ped-A-Pull Series",sp:"צהובים קצרים, מקבילים לרצפה בתחילת המתיחה",st:"ידיים ישרות לפנים בגובה הכתפיים, כפות ידיים פונות מטה.",steps:[["e","מותחים את הקפיץ תוך ירידת הידיים לפנים עד למטה לצידי הגוף."],["i","נותנים לידיים לעלות בחזרה לגובה הכתפיים."]],m:"Latissimus Dorsi + Pectoralis"},
{n:"Adduction",s:"Ped-A-Pull Series",sp:"צהובים קצרים, מקבילים לרצפה בתחילת המתיחה",st:"ידיים ישרות לצדדים בגובה הכתפיים, כפות ידיים פונות מטה.",steps:[["e","מותחים את הקפיץ תוך ירידת הידיים וקירובן אל הגוף."],["i","נותנים לידיים לעלות בחזרה דרך הצדדים לגובה הכתפיים."]],m:"Latissimus Dorsi + Pectoralis"},
{n:"Down Circles",s:"Ped-A-Pull Series",sp:"צהובים קצרים, מקבילים לרצפה בתחילת המתיחה",st:"ידיים ישרות לפנים בגובה הכתפיים, כפות ידיים פונות מטה.",steps:[["e","מותחים את הקפיץ תוך ירידת הידיים לפנים עד למטה לצידי הגוף."],["i","נותנים לידיים לעלות דרך הצדדים בחזרה לקו הכתף, וסוגרים אותן למקביל בצורה מעגלית."]],m:"Latissimus Dorsi + Pectoralis"},
{n:"Up Circles",s:"Ped-A-Pull Series",sp:"צהובים קצרים, מקבילים לרצפה בתחילת המתיחה",st:"כמו Down Circles, בכיוון ההפוך.",steps:[],note:"אותו תרגיל בכיוון ההפוך; הקפיץ נמתח בנשיפה.",m:"Latissimus Dorsi + Pectoralis"},
{n:"Squats",s:"Leg Work",sp:"צהובים, מעט מעל גובה הכתפיים",st:"עמידה עם הפנים אל הקפיצים, ידיים ישרות לפנים, כפות פונות זו אל זו; הולכים אחורה עד מתח בקפיצים, רגליים ברוחב הכתפיים.",steps:[["i","מכופפים ברכיים עד 90 מעלות בין השוק לירך ובין הירך לגב."],["e","מיישרים רגליים בחזרה."]],m:"Quadriceps"},
{n:"Thigh Stretch with RUB",s:"Leg Work",sp:"צהובים, שליש עליון + RUB",st:"עמידה על הברכיים עם הפנים אל הבר, ידיים ישרות קדימה אוחזות בבר מחוץ לקפיצים, הקפיץ מעט מתוח.",steps:[["i","הטיה של הגוף לאחור, שומרים על קו ישר מהברכיים ועד קודקוד הראש."],["e","חוזרים למנח ההתחלתי בלי לשנות את המנח."]],m:"Quadriceps + Iliopsoas"},
{n:"Hanging Back",s:"Full Body Integration",sp:"",st:"עומדים על המיטה, ידיים אוחזות במסגרת העליונה, רגליים נכנסות אחת אחרי השנייה לתוך ידיות הפרווה; האגן שמוט מטה, ידיים ורגליים ישרות.",steps:[["e","מגלגלים את האגן פנימה ועולים להקשתה של עמוד השדרה, בית החזה נפתח לפשיטה, מבט לאחור."],["i","מורידים את האגן לאט בחזרה."]],m:"Spine Extensors"},
{n:"Mermaid",s:"Side Flexion and Rotation",sp:"כחול (Top Loaded)",st:"ישיבה בפרופיל אל הבר, שתי הרגליים מעבר למיטה, היד הקרובה אוחזת בבר ומורידה אותו עד יישור היד, כף היד מטה; היד השנייה ישרה לצד השני באותה זווית.",steps:[["h","הכנה"],["i","מרימים את הכתף לכיוון האוזן."],["e","מורידים את הכתף ומרחיקים אותה מהגוף, בלי שינוי ביציבת עמוד השדרה."],["h","התרגיל המלא"],["i","מרימים את הכתף לכיוון האוזן."],["e","מורידים ומרחיקים את הכתף מהגוף."],["i","ממשיכים את הרחקת הבר ומניעים את הגב לכפיפה צידית; היד השנייה עולה ארוכה מעל הראש, ועצם הישיבה הרחוקה מתנתקת מעט."],["e","מניחים את עצם הישיבה וחוזרים חוליה אחר חוליה."]],note:"אפשר להוסיף פיתול כמו ב-Mermaid על הרפורמר.",m:"Abdominal Obliques"},
{n:"Side Lift with PTB",s:"Side Flexion and Rotation",sp:"כחול (Top Loaded)",st:"שכיבה על הצד, רגליים ישרות בפלקס בתוך רצועת הביטחון, רגל תחתונה לפנים, יד תחתונה ישרה מתחת לראש, יד עליונה מחזיקה את הבר, כף היד פנימה.",steps:[["i","מכופפים את המרפק העליון ומעבירים את הבר אל מעבר למסגרת המיטה."],["e","מכופפים שוב ומיישרים את המרפק למעלה תוך עליית בית החזה, הראש והיד התחתונה לכפיפה צידית."],["i","יורדים עם בית החזה ומתחילים שוב."]],m:"Abdominal Obliques"},
{n:"Side Reach",s:"Side Flexion and Rotation",sp:"כחול (Top Loaded)",st:"ישיבה, כפות רגליים צמודות למסגרת הקדילק, ידיים ארוכות לכיוון התקרה אוחזות בבר, גב ישר נשען לפנים, קו ישר מכפות הידיים לעצמות הישיבה.",steps:[["e","גב תחתון מתעגל ונשען לאחור עד קו ישר של הזרועות עם הבר."],["i","יד אחת מתנתקת מהבר ויורדת למטה, החזה מסתובב, הגב והיד מתארכים אחורה ולמעלה, כפות הידיים באותו גובה."],["e","הגב מתעגל וחוזר למרכז; היד בחצי מעגל למטה חוזרת אל הבר."],["i","שתי הידיים על הבר והגב מתארך למעלה למנח ההתחלתי."]],note:"מצד לצד לסירוגין.",m:"Abdominal Obliques + Spine Extensors"},
{n:"Saw",s:"Side Flexion and Rotation",sp:"כחול (Top Loaded)",st:"מתחילים מאותו מנח של Side Reach.",steps:[["e","מסתובבים עם עמוד השדרה לפיתול, היד הקדמית מעל הרגל הנגדית; לוקחים את הגב להטיה ישר קדימה, היד הקדמית חותכת את הרגל והיד השנייה מתארכת עוד מעלה."],["i","עולים עם החזה מעל האגן וחוזרים למרכז עד שהכתפיים בדיוק מעל האגן."]],note:"מצד לצד לסירוגין. אפשר לחבר את Side Reach ו-Saw לתרגיל אחד משולב.",m:"Abdominal Obliques + Spine Extensors"},
{n:"Spine Stretch Forward",s:"Back Extension",sp:"PTB כחול (Top Loaded)",st:"ישיבה עם רגליים ישרות, פנים אל הבר, כפות הרגליים צמודות למסגרת הקדילק, ידיים אוחזות ב-PTB, גב ישר נשען קדימה, ידיים ישרות למעלה, קו ישר מכפות הידיים לעצמות הישיבה.",steps:[["e","גב תחתון מתעגל ונשען לאחור עד קו ישר של הזרועות עם הבר; לוקחים גב עגול לפנים, ראש לכיוון הרגליים, ומרחיקים את הבר כמה שאפשר קדימה."],["i","מאריכים את הגב קדימה."],["e","הגב מתעגל וחוזר אחורה עד שהזרועות בקו ישר עם הבר."],["i","מאפשרים לבר לעלות ולגב להתיישר, ונשענים קדימה למנח ההתחלתי."]],m:"Abdominal Obliques + Spine Extensors"},

{n:"Bottom Lift with Extensions",s:"Spinal Articulation",sp:"אדום, אדום, צהוב",st:"מגלגלים את האגן למנח Bottom Lift למעלה, כפות רגליים בפלקס.",steps:[["i","רגליים דוחפות את הבר כמעט עד יישור מלא."],["e","תוך איסוף מרכז הגוף ושחרור שרירי הישבן, רגליים מתכופפות והמיטה נסגרת."]],note:"חוזרים מספר פעמים לפני הירידה. ככל שהקפיצים קלים יותר, התרגיל מאתגר יותר.",m:"Hamstrings"},
{n:"Semi-Circle",s:"Spinal Articulation",sp:"אדום",st:"שכיבה על הגב, הגב התחתון והאגן מעבר לעגלה בפשיטה מלאה, ידיים ישרות לאחור כנגד הכתפות, כפות ידיים פונות החוצה, כריות הבהונות על הבר ב-V קטן, עקבים מחוברים.",steps:[["e","מגלגלים את האגן חוליה אחר חוליה עד קו אחד מהכתפיים לקודקוד הראש."],["i","דוחפים את הבר ומאריכים את הרגליים עד יישור מלא."],["e","מניחים חוליה אחר חוליה על המזרן ומעבר לו, עד פשיטה מלאה של הגב התחתון."],["i","מכופפים ברכיים וסוגרים את העגלה למנח ההתחלתי."]],note:"אפשר גם בכיוון ההפוך (Reverse).",m:"Hamstrings"},
{n:"Triceps",s:"Arms Supine",sp:"אדום, צהוב",st:"שכיבה על הגב, גב נטרלי, רגליים כפופות וצמודות ב-90 מעלות, ידיים ברצועות, מרפקים מונחים על המזרן כפופים ל-90 מעלות.",steps:[["e","מרפקים מתיישרים, כפות הידיים מגיעות עד המזרן."],["i","מרפקים מתכופפים בחזרה ל-90 מעלות."]],m:"Triceps"},
{n:"Extension",s:"Arms Supine",sp:"אדום, צהוב",st:"שכיבה על הגב, ידיים ברצועות ישרות לתקרה בקו הכתף, כפות ידיים פונות לפנים.",steps:[["e","ידיים יורדות ישרות אל המזרן."],["i","ידיים עולות בחזרה מעל הכתפיים."]],m:"Latissimus Dorsi"},
{n:"Adduction",s:"Arms Supine",sp:"אדום, צהוב",st:"שכיבה על הגב, ידיים ישרות על המיטה, כפות ידיים פונות פנימה אל הגוף.",steps:[["i","ידיים נפתחות לצדדים עד קו הכתפיים."],["e","ידיים נסגרות בחזרה לכיוון האגן."]],m:"Latissimus Dorsi"},
{n:"Down Circles (Arms)",s:"Arms Supine",sp:"אדום, צהוב",st:"שכיבה על הגב, ידיים ישרות לתקרה, כפות ידיים פונות לפנים.",steps:[["e","ידיים יורדות ישרות אל המזרן."],["i","ידיים נפתחות לצדדים ועולות במעגל בחזרה מעל הכתפיים."]],m:"Latissimus Dorsi + Pectoralis + Teres Major"},
{n:"Up Circles (Arms)",s:"Arms Supine",sp:"אדום, צהוב",st:"שכיבה על הגב, ידיים ישרות על המזרן, כפות ידיים פונות מטה.",steps:[["i","ידיים עולות עד מעל הכתפיים ונפתחות לצדדים."],["e","ידיים נסגרות לכיוון הגוף."]],m:"Latissimus Dorsi + Pectoralis + Teres Major"},
{n:"Chest Expansion",s:"Arms Sitting",sp:"כחול, צהוב",st:"ישיבה שלמה עם הפנים אל הרצועות, רגליים ישרות וצמודות בין הכתפות, כפות רגליים מעט מעבר למשענת הראש, גב נטרלי, ידיים ברצועות ישרות לפני קו הגוף, כפות פונות לאחור.",steps:[["e","בית החזה מתרחב ומניעים את הידיים ישרות לאחור."],["i","הידיים חוזרות לפנים."]],note:"התנועה לא גדולה: הידיים מגיעות רק מעט אחרי קו הגוף.",m:"Latissimus Dorsi"},
{n:"Biceps",s:"Arms Sitting",sp:"כחול, צהוב",st:"ישיבה שלמה מול הרצועות, ידיים ישרות לפנים בקו הכתפיים, כפות פונות לתקרה.",steps:[["e","מכופפים מרפקים ל-90 מעלות."],["i","מיישרים מרפקים בחזרה."]],m:"Biceps"},
{n:"Rhomboids",s:"Arms Sitting",sp:"כחול, צהוב",st:"ישיבה שלמה מול הרצועות, מרפקים ברצועות בגובה הכתפיים, ידיים ב-90 מעלות.",steps:[["e","מרפקים נפתחים החוצה, ובהמשך התנועה השכמות מתקרבות אחת אל השנייה."],["i","שכמות מתרחקות, ובהמשך סוגרים את המרפקים קדימה."]],m:"Rhomboids"},
{n:"Hug-A-Tree",s:"Arms Sitting",sp:"כחול",st:"ישיבה שלמה עם הפנים אל הבר, גב זקוף צמוד לכתפות, רגליים ישרות וצמודות. ידיים ארוכות לצדדים כמעט ישרות, כפות ידיים בגובה החזה, מרפקים מעט עגולים.",steps:[["e","מניעים את הידיים לפנים בצורת חיבוק."],["i","ידיים נפתחות בחזרה להתחלה."]],m:"Pectoralis"},
{n:"Down Circles (Sitting)",s:"Arms Sitting",sp:"כחול",st:"ישיבה עם הפנים אל הבר, ידיים ארוכות לצדדים, כפות ידיים בגובה בית החזה.",steps:[["i","ידיים עולות דרך הצדדים למעלה."],["e","ידיים יורדות קדימה לגובה בית החזה."],["i","ידיים נפתחות ושוב עולות."]],m:"Pectoralis"},

{n:"Salute",s:"Arms Sitting",sp:"כחול",st:"ישיבה עם הפנים אל הבר, מרפקים כפופים ומקבילים, אגודלים צמודים לרקות, כפות ידיים פונות לפנים.",steps:[["e","מיישרים מרפקים בלי לשנות את גובה המרפק."],["i","מכופפים מרפקים ומחזירים את האגודלים לרקות."]],m:"Triceps"},
{n:"Chest Expansion (Kneeling)",s:"Arms Kneeling",sp:"כחול, צהוב",st:"עמידה על הברכיים עם הפנים לרצועות, ברכיים צמודות לכתפות, ידיים אוחזות בשורש הרצועה, ישרות מעט לפני קו הגוף. (וריאציה: עמידה על הברכיים עם הפנים אל הבר, כפות הרגליים על משענת הראש.)",steps:[["e","מניעים את הידיים לאחור תוך שמירה על מנח הגוף, הידיים ישרות."],["i","מחזירים את הידיים לפנים."]],m:"Latissimus Dorsi"},
{n:"Down Circles (Kneeling)",s:"Arms Kneeling",sp:"כחול",st:"עמידה על הברכיים, ידיים ישרות למטה לצידי הגוף, כפות ידיים פונות לפנים.",steps:[["e","דרך הצדדים ידיים עולות למעלה, ידיים בזווית העיניים."],["i","ידיים יורדות כל הדרך למטה לצידי הגוף."]],m:"Deltoid + Pectoralis"},
{n:"Up Circles (Kneeling)",s:"Arms Kneeling",sp:"כחול",st:"עמידה על הברכיים, ידיים ישרות למטה לצידי הגוף, כפות ידיים פונות לפנים.",steps:[["e","ידיים עולות לפנים כל הדרך למעלה."],["i","ידיים יורדות דרך הצדדים בחזרה למטה."]],m:"Deltoid + Pectoralis"},
{n:"Triceps (Kneeling)",s:"Arms Kneeling",sp:"כחול",st:"עמידה על הברכיים, ידיים ישרות לתקרה, אגודלים ואצבעות מחוברים בצורת יהלום, מרפקים כפופים ומקבילים, כפות ידיים מאחורי הראש.",steps:[["e","מיישרים מרפקים ושומרים על גובה המרפק; המרפק משמש ציר תנועה."],["i","מרפקים מתכופפים בחזרה."]],m:"Triceps"},

{n:"Deltoid Reach",s:"Arms Kneeling Side Series",sp:"צהוב",st:"עמידה על הברכיים בפרופיל, ברכיים צמודות לכתפות, רצועה ביד הקרובה לרצועות, מרפק כפוף ומקביל, כף היד קרובה לאוזן ופונה פנימה.",steps:[["e","מאריכים את היד לכיוון התקרה, הכתף משוחררת מטה."],["i","מכופפים את המרפק בחזרה."]],m:"Anterior Deltoid"},
{n:"Cross Arm Pull",s:"Arms Kneeling Side Series",sp:"צהוב",st:"ברכיים צמודות לכתפות, רצועה ביד הרחוקה מהכתפות, כף היד צמודה לטבור, מרפק פתוח הצידה.",steps:[["e","מושכים את הרצועה: קודם מרחיקים את המרפק הצידה, אחר כך מיישרים את האמה ולבסוף את כף היד."],["i","חוזרים: כף יד, אמה ואז מרפק, עד המנח ההתחלתי."]],m:"Teres Minor + Infraspinatus + Posterior Deltoid"},
{n:"Triceps Extension",s:"Arms Kneeling Side Series",sp:"צהוב",st:"ברכיים במרכז העגלה, רצועה ביד הרחוקה מהכתפות, יד שנייה על הכתפה הקדמית, הגב בכפיפה צידית; היד עם הרצועה מעל הראש, מרפק כפוף, כף היד פונה מעלה, מבט ליד התחתונה.",steps:[["e","מיישרים את היד העליונה לכיוון התקרה."],["i","מכופפים בחזרה."]],m:"Triceps"},
{n:"Hug A Moon",s:"Arms Kneeling Side Series",sp:"צהוב",st:"ברכיים במרכז העגלה, רצועה ביד הקרובה לכתפות, ידיים ארוכות לצדדים מעט למעלה בזווית העיניים; בוחרים את המקום לפי רצועה ישרה.",steps:[["e","ידיים עולות לכיוון התקרה."],["i","ידיים נפתחות בחזרה לצדדים."]],m:"Deltoid + Supraspinatus"},
{n:"Double Arm",s:"Shoulder Push",sp:"אדום, צהוב",st:"עמידה על הברכיים, כפות רגליים בפלקס כנגד הכתפות, ידיים על הבר, מרפקים כפופים פונים מטה, גב ישר מקביל לרצפה, כתפיים בגובה האגן, צוואר בהמשך לגב.",steps:[["e","ידיים דוחפות את הבר עד יישור מלא של המרפקים."],["i","מכופפים מרפקים בחזרה."]],m:"Triceps"},
{n:"Single Arm",s:"Shoulder Push",sp:"אדום",st:"עמידה על הברכיים, כפות רגליים בפלקס כנגד הכתפות, יד אחת על הבר, מרפק כפוף ופונה מטה, יד שנייה בקצה העגלה; גב ישר מקביל לרצפה.",steps:[["e","היד דוחפת את הבר עד יישור מלא של המרפק."],["i","מכופפים את המרפק בחזרה."]],m:"Triceps"},
{n:"Rowing Back 1 (Into the Sternum)",s:"Rowing Series",sp:"כחול, צהוב",st:"ישיבה שלמה עם הפנים לרצועות, גב זקוף, כתפיים מעל עצמות הישיבה, רגליים ישרות על משענת הראש, ידיים ברצועות ישרות לפנים, כפות ידיים פונות זו אל זו.",steps:[["i","מכופפים מרפקים לצדדים, כפות ידיים פונות אל הגוף."],["e","מקמרים את הגב התחתון לאחור תוך שמירה על מנח הידיים."],["i","מיישרים ידיים לצדדים והופכים את כפות הידיים לאחור."],["e","מניעים את הגב עגול לפנים עד שהמצח לכיוון הרגליים, ידיים לאחור."],["i","מעבירים ידיים במעגל גדול קדימה ומסובבים כפות ידיים זו אל זו."],["e","מיישרים את הגב חוליה אחר חוליה למנח ההתחלתי."]],note:"שלושה מחזורי אוויר.",m:"Posterior Deltoid + Rhomboids"},
{n:"Rowing Back 2 (90 Degrees)",s:"Rowing Series",sp:"כחול, צהוב",st:"ישיבה שלמה עם הפנים לרצועות, גב זקוף, רגליים ישרות על משענת הראש, ידיים ברצועות ישרות לפנים, כפות ידיים לתקרה.",steps:[["i","מכופפים מרפקים מקבילים ל-90 מעלות, בגובה הכתף."],["e","מקמרים את הגב התחתון לאחור תוך שמירה על מנח הידיים."],["i","מאריכים את הגב בהטיה לאחור ומיישרים זרועות לתקרה."],["e","חוזרים בגב זקוף לפנים עד שהכתפיים מעל עצמות הישיבה, ופותחים זרועות ארוכות לצדדים בלי להזיז את העגלה."],["i","במקום."],["e","סוגרים ידיים בחזרה לפנים."]],note:"שלושה מחזורי אוויר.",m:"Biceps"},
{n:"Rowing Front 1",s:"Rowing Series",sp:"כחול",st:"ישיבה שלמה, גב לרצועות, גב זקוף, כתפיים מעל עצמות הישיבה, רגליים ישרות לפנים, כפות ידיים ברצועות, ידיים כפופות וצמודות לגוף, כפות ידיים פונות מעלה.",steps:[["e","מיישרים מרפקים תוך סיבוב הזרועות כך שכפות הידיים פונות זו אל זו; מורידים ידיים ישרות עד מגע במיטה."],["i","מרימים ידיים למעלה, מפנים כפות ידיים לפנים, פותחים לצדדים עד מנח T."]],note:"מחזור אוויר אחד.",m:"Deltoid + Lower Trapezius"},
{n:"Rowing Front 2",s:"Rowing Series",sp:"כחול",st:"ישיבה, גב לרצועות, גב עגול, רגליים ישרות לפנים, אגודלים ברצועות, ידיים כפופות וצמודות לגוף, כפות ידיים פונות מעלה.",steps:[["e","מקמרים את הגב לפנים ומיישרים מרפקים תוך סיבוב הזרועות; מורידים ידיים ישרות עד מגע במיטה."],["i","מיישרים את הגב לפנים ומרימים ידיים מעבר לראש, חוזרים לגב ישר במרכז וידיים לתקרה, מפנים כפות לפנים ופותחים לצדדים עד מנח T."]],note:"מחזור אוויר אחד.",m:"Deltoid + Lower Trapezius"},
{n:"Skating",s:"Leg Work – Split Series",sp:"כחול, צהוב",st:"עמידה על המיטה: רגל אחת על משטח העמידה, רגל שנייה על קצה העגלה, ברכיים מעט כפופות, ידיים ישרות לצידי הגוף.",steps:[["e","מיישרים רגל אחת, הרגל השנייה נשארת כפופה."],["i","מכופפים את הרגל בחזרה."]],note:"אפשר גם בשילוב שני הצדדים: נשיפה – מיישרים את הרגל שעל משטח העמידה, העגלה נפתחת, מיישרים את הרגל שעל העגלה ומכופפים את זו שעל המשטח; שאיפה – סוגרים את העגלה, שתי הברכיים כפופות.",m:"Gluteus Medius + Quadriceps"},
{n:"Side Split",s:"Leg Work – Split Series",sp:"כחול",st:"עמידה על המיטה: רגל אחת על משטח העמידה, רגל שנייה על העגלה במרכז שלה, ידיים ישרות לצידי הגוף, כפות פונות פנימה.",steps:[["i","מאפשרים למיטה להיפתח תוך פתיחת הרגליים לפיסוק, מרימים ידיים ישרות עד קו הכתפיים."],["e","סוגרים את העגלה, וידיים נסגרות אל הגוף למנח ההתחלתי."]],m:"Hip Adductors"},
{n:"Jumping Board",s:"Leg Work",sp:"הכנה: אדום, אדום, ירוק · מלא: כחול, צהוב · רגל אחת: כחול",st:"שכיבה על הגב, גב נטרלי, ידיים לצידי הגוף, כפות רגליים על הג'מפינג בורד, מקבילות.",steps:[["h","הכנה לקפיצה"],["e","מיישרים ברכיים ועולים על האצבעות."],["i","מכופפים ברכיים ולבסוף מורידים עקבים."],["h","הכנה לנחיתה"],["e","עולים על האצבעות ומיישרים רגליים."],["i","מניחים עקבים ומכופפים ברכיים."],["h","התרגיל המלא"],["e","דוחפים את הבורד לקפיצה; באוויר הרגליים ישרות."],["i","נוחתים ברכות על האצבעות ואז על העקב, תוך כפיפת הברכיים."]],note:"פוזיציות: Parallel (רגליים מקבילות) · V-Position · Single Leg Parallel (רגל אחת קופצת, השנייה ב-90) · Leg Changes (החלפות בין הרגליים).",m:"Quadriceps + Hamstrings"},
{n:"Stomach Massage",s:"Full Body Integration",sp:"אדום, אדום, צהוב",st:"ישיבה במרכז העגלה עם הפנים אל הבר, אצבעות כפות הרגליים על הבר ב-V קטן, עקבים ביחד.",steps:[["e","דוחפים את המיטה עד יישור הרגליים, ירכיים צמודות, מורידים עקבים לפלקס ומרימים בחזרה לפוינט."],["i","מכופפים ברכיים בחזרה למנח ההתחלתי."]],note:"בקצב מהיר, בשלושה מנחים: Round Back (גב עגול, ידיים בקצה הקדמי של העגלה) · Flat Back (גב ישר, ידיים ישרות על הכתפות, כפות לאחור) · Reaching (גב ישר, ידיים ישרות למעלה, כפות לפנים).",m:"Abdominals + Back Extensors"},
{n:"Scooter",s:"Knee Stretch Series",sp:"אדום, צהוב",st:"עמידה: רגל אחת על הרצפה ליד מרכז העגלה, רגל שנייה על המיטה בפלקס כנגד הכתפה הקרובה, ברך באוויר. ידיים על הבר, גב עגול, משקל לאחור, מבט פנימה.",steps:[["i","הרגל שעל המיטה דוחפת את העגלה לאחור."],["e","הרגל מתכופפת ומאפשרת למיטה להיסגר לפנים."]],note:"בקצב יחסית גבוה; הגוף נשאר במנח ההתחלתי והתנועה מהרגל בלבד.",m:"Abdominals + Quadriceps + Hamstrings"},
{n:"Knee Stretch Round Back",s:"Knee Stretch Series",sp:"אדום, צהוב",st:"עמידה על הברכיים, כפות רגליים בפלקס כנגד הכתפות, ידיים על הבר, גב עגול, משקל לאחור, מבט אל הבטן.",steps:[["i","רגליים דוחפות את העגלה, הגב לא משתנה."],["e","איסוף עמוק של הבטן, הגב מתעגל עוד יותר, ברכיים מתקרבות לפנים והמיטה נסגרת."]],note:"הדגש: גיוס השרירים בסגירת העגלה.",m:"Abdominals + Quadriceps + Hamstrings"},
{n:"Knee Stretch Flat Back",s:"Knee Stretch Series",sp:"אדום, צהוב",st:"אותו מנח, גב נטרלי, משקל לאחור, כתפיים בגובה האגן, צוואר בהמשך לגב.",steps:[["i","רגליים דוחפות את העגלה, הגב לא משתנה."],["e","איסוף בטן, הגב נשאר נטרלי, ברכיים מתקרבות לפנים והמיטה נסגרת."]],m:"Quadriceps + Hamstrings"},
{n:"Reverse Knee Stretch Round Back",s:"Knee Stretch Series",sp:"צהוב",st:"עמידת שש, ברכיים צמודות לכתפות, כפות ידיים על מסגרת המיטה מתחת לכתפיים, אצבעות בצד החיצוני, גב עגול.",steps:[["e","מעמיקים את קימור הגב, בטן נאספת, מושכים את המיטה מכוח הבטן, ברכיים מתקרבות אל הידיים."],["i","מאפשרים למיטה לחזור, הגב נשאר עגול."]],m:"Rectus Abdominus"},
{n:"Reverse Knee Stretch Flat Back",s:"Knee Stretch Series",sp:"צהוב",st:"אותו מנח, גב נטרלי, צוואר בהמשך לגב.",steps:[["e","בטן נאספת, מושכים את המיטה מכוח הבטן, ברכיים מתקרבות לידיים בלי לשנות את מנח הגב."],["i","מאפשרים למיטה לחזור, הגב נשאר נטרלי."]],m:"Transverse Abdominus"},
{n:"Down Stretch 1+2+3",s:"Full Body Integration",sp:"אדום",st:"עמידה על הברכיים, כפות רגליים בפלקס כנגד הכתפות, ידיים על הבר, הגב בפשיטה, פשיטה מלאה במפרק הירך.",steps:[["h","1"],["i","דוחפים את המיטה לאחור, מנח הגוף לא משתנה; מפרק הכתף הוא ציר התנועה."],["e","המיטה נסגרת בחזרה."],["h","2 (מתחילים כשהמיטה פתוחה, קו ישר מהברכיים לקודקוד)"],["i","בלי תנועה של העגלה, לוקחים את האגן לאחור עד שהגב מקביל לרצפה, עמוד שדרה נטרלי."],["e","בלי תנועה של העגלה, מקמרים את הגב ומחזירים את האגן לפנים."],["h","3 (שילוב של הכול)"],["i","דוחפים את המיטה לאחור, מפרק הכתף הוא ציר התנועה."],["e","בלי תנועת עגלה, האגן לאחור עד גב מקביל לרצפה."],["i","מקמרים את הגב, המיטה נסגרת וברכיים באות לפנים."],["e","האגן עולה בחזרה לפשיטה."]],m:"Abdominals + Deltoid"},
{n:"Elephant",s:"Up Stretch Series",sp:"אדום",st:"עמידה על המיטה, כפות רגליים צמודות לכתפות, ידיים ישרות על הבר ברוחב הכתפיים, גב עגול בקימור מקסימלי.",steps:[["i","פותחים את המיטה חצי דרך לאחור, התנועה רק ממפרק הירך, מאריכים את הגב ליישור מלא."],["e","אוספים בטן, מעמיקים את הקימור וסוגרים את המיטה."]],m:"Abdominals + Spine Extensors + Deltoid"},
{n:"Up Stretch 1+2+3",s:"Up Stretch Series",sp:"אדום, צהוב",st:"עמידה על המיטה על קצות האצבעות, עקבים צמודים לכתפות, ידיים ישרות על הבר ברוחב הכתפיים, עצמות הישיבה לתקרה, גב ישר, צוואר בהמשך לגב, אוזניים בין הידיים.",steps:[["h","1"],["i","פותחים את המיטה, שומרים על אורך הגב ועל מנח הפירמידה."],["e","אוספים בטן וסוגרים את המיטה."],["h","2"],["i","מורידים את האגן עד Front Support, הכתפיים במקום ומשמשות ציר תנועה."],["e","המיטה נסגרת, הגב נשאר ישר, עצמות הישיבה חוזרות לתקרה (Up Stretch 1)."],["h","3"],["i","מורידים את האגן ל-Front Support, הכתפיים ציר התנועה (Up Stretch 2)."],["e","מעבירים משקל לפנים, המיטה נסגרת, הכתפיים עוברות את קו הבר, מנח הגוף נשמר."],["i","מרימים את האגן בחזרה ל-Up Stretch 1."]],m:"Abdominals + Spine Extensors + Deltoid"},
{n:"Long Stretch",s:"Full Body Integration",sp:"אדום, צהוב",st:"מנח Front Support: ידיים על הבר ברוחב הכתפיים, כפות רגליים כנגד הכתפות.",steps:[["i","מרחיקים את העגלה לאחור, שומרים על מנח הגוף."],["e","סוגרים את העגלה, הכתפיים עוברות מעבר לבר, מנח הגוף נשמר."]],m:"Abdominals + Deltoid"},
{n:"Long Back Stretch",s:"Full Body Integration",sp:"אדום, צהוב",st:"ישיבה על הבר, ידיים על הבר, אצבעות קדימה, כפות הרגליים כנגד הכתפות.",steps:[["i","מרפקים מתכופפים מקבילים, האגן יורד נמוך מהבר."],["e","מגלגלים את האגן פנימה, המיטה זזה, האגן עולה והידיים מתיישרות עד קו ישר מכפות הרגליים לקודקוד."],["i","מאפשרים למיטה להיסגר למנח ההתחלתי; הישבן מוביל, הגב מתיישר."]],m:"Triceps + Serratus Anterior + Hamstrings"},
{n:"Tendon Stretch",s:"Full Body Integration",sp:"אדום",st:"יושבים על הבר, כפות הרגליים בקצה העגלה, עקבים באוויר, ידיים על הבר; מנתקים ישבן ומיישרים רגליים, המיטה סגורה, הראש לכיוון הרגליים, גב עגול.",steps:[["i","דוחפים את העגלה לפנים תוך ירידה של האגן, שומרים על קימור הגב."],["e","חוזרים למנח ההתחלתי תוך איסוף מרכז הגוף פנימה."]],m:"Serratus Anterior + Rectus Abdominus"},
{n:"Balance Control Front",s:"Full Body Integration",sp:"אדום",st:"מנח Front Support, כפות הידיים על הכתפות ובהונות הרגליים על הבר.",steps:[["e","ידיים דוחפות את העגלה קדימה; הכתף היא ציר התנועה, בלי שינוי של מנח הגוף."],["i","ידיים חוזרות אל מתחת לכתפיים."]],m:"Abdominals + Deltoid"},
{n:"Balance Control Back",s:"Full Body Integration",sp:"אדום",st:"מנח Back Support עם האגן מטה, לא מונח. כפות ידיים על הכתפות ובהונות הרגליים על הבר.",steps:[["e","מרימים את האגן לקו הגוף תוך הרחקת העגלה לאחור."],["i","מחזירים את האגן מטה וידיים מתקרבות אל הגוף, ישרות לאורך כל התרגיל."]],m:"Triceps + Hamstrings"},
{n:"Mermaid",s:"Side Flexion and Rotation",sp:"אדום",st:"ישיבה על המיטה בפרופיל: ברך כפופה לפנים ב-90, כף הרגל צמודה לירך השנייה; ברך שנייה כפופה לאחור, השוק צמודה לכתפות. יד אחת על הבר ישרה, יד שנייה ישרה לצד השני, שתי עצמות הישיבה על המזרן.",steps:[["i","דוחפים את הבר ויוצרים הטיה צידית; עצם הישיבה הרחוקה מתנתקת מעט, היד הרחוקה עולה לקו אחד עם היד שעל הבר."],["e","מסתובבים עם החזה לכיוון הבר, היד השנייה מצטרפת אל הבר, צוואר בהמשך לגב."],["i","היד נפתחת בחזרה לנקודה שממנה יצאה לפיתול."],["e","מחזירים את עצם הישיבה למזרן וחוזרים מההטיה לגוף ישר."]],m:"Abdominal Obliques"},
{n:"Side Over on Box",s:"Side Flexion and Rotation",sp:"כל הקפיצים",st:"ישיבה על הקופסה בפרופיל, הקופסה צמודה לכתפות, רגל אחת ברצועת הביטחון, רגל שנייה על הקופסה ב-90 מהגוף, ידיים שלובות מאחורי הראש, מרפקים בזווית העיניים.",steps:[["i","יורדים לכפיפה צידית עד שהמרפק התחתון עובר מעבר לעגלה; הרגל שברצועה מתיישרת, עצם הישיבה מתנתקת."],["e","אוספים בטן, עולים עם החזה עד קו ישר מהעקב שברצועה עד הקודקוד."],["i","מיישרים ידיים למעלה בהמשך לקו הגוף."],["e","מכופפים ידיים אל הראש ויורדים בחזרה לכפיפה צידית."],["i","במקום, למטה."]],m:"Abdominal Obliques"},
{n:"Breaststroke",s:"Back Extension – Long Box Series",sp:"הכנה: אדום, צהוב · מלא: כחול",st:"קופסה לאורך המיטה, שוכבים עליה על הבטן, קו החזה בקצה הקופסה. הכנה: פנים אל הבר, ידיים על הבר, מרפקים פונים לצדדים. מלא: פנים אל הבר, אגודלים ברצועות, מרפקים כפופים וצמודים לגוף, כפות ידיים לצידי הכתפיים.",steps:[["h","הכנה"],["e","דוחפים את הבר עד יישור מלא של הזרועות."],["i","מרימים את החזה לפשיטה, צוואר בהמשך לגב."],["e","מורידים את בית החזה."],["i","מכופפים מרפקים בחזרה."],["h","התרגיל המלא"],["e","מיישרים ידיים לפנים בהמשך לקו הגוף."],["i","בית החזה עולה לפשיטה תוך פתיחת הידיים לצדדים עד האגן, ומכופפים מרפקים בחזרה."]],note:"כדי להתמקם: אגודלים ברצועות, אוחזים בקצה הקדמי של הקופסה, ורק אז עולים ונשכבים עליה.",m:"Spine Extensors + Deltoid"},
{n:"Pulling Straps",s:"Back Extension – Long Box Series",sp:"כחול",st:"שכיבה על הקופסה עם הפנים אל הרצועות, ידיים אוחזות בחבלים עצמם.",steps:[["e","ידיים מושכות את החבלים מלמטה לצידי הגוף, בית החזה עולה לפשיטה."],["i","ידיים יורדות וחוזרות לפנים, בית החזה יורד."]],m:"Spine Extensors + Latissimus Dorsi"},
{n:"T Pull",s:"Back Extension – Long Box Series",sp:"כחול",st:"כמו ב-Pulling Straps.",steps:[["e","ידיים נפתחות לצדדים וממשיכות עד הצמדה לצידי הגוף, בית החזה עולה לפשיטה."],["i","דרך הצדדים ידיים חוזרות, והחזה יורד."]],m:"Spine Extensors + Latissimus Dorsi"},
